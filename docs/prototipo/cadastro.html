<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>CSTM — Protótipo da tela de cadastro (conceito C)</title>
<!--
  Protótipo estático da tela de cadastro, conceito C de docs/telas.md.
  Não faz parte do aplicativo: abre direto no navegador, sem build.
  Estados selecionáveis na barra superior ou pela URL: cadastro.html#estado=edicao&tema=escuro
-->
<style>
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  .theme-light {
    --base: #eef0f3;
    --layer: #ffffff;
    --layer-alt: #f9f9f9;
    --stroke: rgba(0, 0, 0, 0.08);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1a1a1a;
    --text-2: #5d5d5d;
    --text-3: #8b8b8b;
    --hover: rgba(0, 0, 0, 0.04);
    --selected: rgba(0, 0, 0, 0.065);
    --accent: #005fb8;
    --accent-hover: #1a6fc2;
    --on-accent: #ffffff;
    --accent-soft: rgba(0, 95, 184, 0.14);
    --star: #d49a00;
    --danger: #c42b1c;
    --danger-bg: #fde7e9;
    --warning: #8a5300;
    --warning-bg: #fff4ce;
    --success: #0f7b0f;
    --success-bg: #dff6dd;
    --overlay: rgba(0, 0, 0, 0.3);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.14), 0 0 1px rgba(0, 0, 0, 0.2);
    --control: #ffffff;
    --control-bottom: rgba(0, 0, 0, 0.22);
  }

  .theme-dark {
    --base: #1c1c1c;
    --layer: #272727;
    --layer-alt: #2c2c2c;
    --stroke: rgba(255, 255, 255, 0.07);
    --stroke-strong: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-2: #c8c8c8;
    --text-3: #9a9a9a;
    --hover: rgba(255, 255, 255, 0.05);
    --selected: rgba(255, 255, 255, 0.085);
    --accent: #60cdff;
    --accent-hover: #74d4ff;
    --on-accent: #000000;
    --accent-soft: rgba(96, 205, 255, 0.18);
    --star: #ffc83d;
    --danger: #ff99a4;
    --danger-bg: #442726;
    --warning: #fce100;
    --warning-bg: #433519;
    --success: #6ccb5f;
    --success-bg: #393d1b;
    --overlay: rgba(0, 0, 0, 0.5);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 1px rgba(0, 0, 0, 0.6);
    --control: #2d2d2d;
    --control-bottom: rgba(255, 255, 255, 0.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 24px 40px;
    font-family: var(--font);
    font-size: 14px;
    background: #d9dce1;
    color: #1a1a1a;
  }

  /* ---------- Painel do protótipo (fora da janela) ---------- */
  .proto-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto 10px;
  }
  .proto-bar button {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 10px;
    border: 1px solid #b9bdc4;
    border-radius: 999px;
    background: #f4f5f7;
    cursor: pointer;
  }
  .proto-bar button.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  .proto-bar .sep { width: 1px; height: 20px; background: #b9bdc4; margin: 0 6px; }
  .proto-note {
    max-width: 1100px;
    margin: 0 auto 14px;
    font-size: 13px;
    color: #374151;
    min-height: 20px;
  }

  /* ---------- Janela ---------- */
  .window {
    position: relative;
    width: 1100px;
    height: 700px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: 32px 1fr 28px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--base);
    color: var(--text);
    border: 1px solid var(--stroke-strong);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 12px;
    font-size: 12px;
    color: var(--text-2);
    -webkit-user-select: none;
    user-select: none;
  }
  .app-icon {
    width: 16px; height: 16px; border-radius: 4px;
    background: linear-gradient(135deg, #2b88d8, #005fb8);
    color: #fff; font-size: 10px; font-weight: 700;
    display: grid; place-items: center;
  }
  .titlebar .controls { margin-left: auto; display: flex; height: 100%; }
  .titlebar .controls span {
    width: 46px; display: grid; place-items: center; color: var(--text-2);
  }
  .titlebar .controls svg { width: 10px; height: 10px; }

  .body {
    display: grid;
    grid-template-columns: var(--tree-w, 290px) 5px 1fr;
    min-height: 0;
  }

  /* ---------- Árvore ---------- */
  .tree-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 6px 4px 8px 8px;
  }
  .tree-head { display: flex; gap: 6px; padding: 2px 4px 8px 0; }
  .search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 10px;
    border-radius: 4px;
    background: var(--control);
    border: 1px solid var(--stroke);
    border-bottom-color: var(--control-bottom);
    color: var(--text-3);
  }
  .search.active { border-bottom: 2px solid var(--accent); }
  .search .q { color: var(--text); flex: 1; }
  .search .caret { display: inline-block; width: 1px; height: 16px; background: var(--text); vertical-align: middle; margin-left: 1px; }
  .search svg { width: 16px; height: 16px; flex: none; }
  .search .clear { color: var(--text-2); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    font: inherit;
    border-radius: 4px;
    border: 1px solid var(--stroke);
    border-bottom-color: var(--control-bottom);
    background: var(--control);
    color: var(--text);
    cursor: default;
    white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn.accent { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
  .theme-dark .btn.danger { color: #000; }
  .btn.subtle { background: transparent; border-color: transparent; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn:disabled { opacity: 0.4; }
  .btn .chev { width: 12px; height: 12px; opacity: 0.85; }

  .chips { display: flex; gap: 6px; padding: 0 4px 6px 0; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--stroke-strong);
    font-size: 12.5px; color: var(--text-2);
  }
  .chip svg { width: 14px; height: 14px; }
  .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--text); }
  .chip.on svg { color: var(--star); }
  .results-info { margin-left: auto; font-size: 12px; color: var(--text-3); padding-right: 6px; }

  .tree { flex: 1; overflow: auto; padding-right: 4px; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    padding: 5px 6px 5px calc(8px + var(--depth) * 18px);
    border-radius: 4px;
    color: var(--text);
  }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--selected); }
  .row.selected::before {
    content: ""; position: absolute; left: 0; top: 50%;
    width: 3px; height: 16px; margin-top: -8px;
    border-radius: 2px; background: var(--accent);
  }
  .row.context { outline: 1px solid var(--accent); outline-offset: -1px; }
  .row .tw { width: 16px; height: 16px; flex: none; color: var(--text-3); display: grid; place-items: center; }
  .row .tw svg { width: 12px; height: 12px; }
  .row .ic { width: 16px; height: 16px; flex: none; color: var(--text-2); }
  .row.folder .ic { color: #c69a2b; }
  .theme-dark .row.folder .ic { color: #e8c15c; }
  .row .label { flex: 1; min-width: 0; }
  .row .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .excerpt { display: block; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .star { width: 14px; height: 14px; color: var(--star); flex: none; }
  .row .more { width: 24px; height: 24px; border-radius: 4px; display: none; place-items: center; color: var(--text-2); flex: none; }
  .row .more svg { width: 16px; height: 16px; }
  .row:hover .more, .row.selected .more, .row.context .more { display: grid; }
  .row.draft .name { font-style: italic; color: var(--text-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.warn { background: var(--warning); }
  .dot.err { background: var(--danger); }
  .dot.pending { background: var(--text-3); }
  mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
  .row.cut .ic, .row.cut .label, .row.cut .star { opacity: 0.45; }
  .row.drop-into { background: var(--accent-soft); outline: 1px solid var(--accent); outline-offset: -1px; }
  .drop-line {
    position: relative; height: 2px; border-radius: 1px; background: var(--accent);
    margin: -1px 6px -1px calc(14px + var(--depth) * 18px);
  }
  .drop-line::before {
    content: ""; position: absolute; left: -6px; top: -3px;
    width: 6px; height: 6px; border-radius: 50%; border: 2px solid var(--accent); background: var(--layer);
  }
  .drag-ghost {
    position: absolute; z-index: 12;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 8px; border-radius: 4px;
    background: var(--layer); border: 1px solid var(--stroke-strong); box-shadow: var(--shadow);
    font-size: 12.5px; opacity: 0.95; pointer-events: none;
  }
  .drag-ghost svg { width: 16px; height: 16px; color: var(--text-2); }
  .drag-ghost .count {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600;
    display: grid; place-items: center;
  }
  .drag-ghost .copy-mark { color: var(--accent); font-weight: 700; }
  .tree-foot { border-top: 1px solid var(--stroke); margin: 4px 4px 0 0; padding-top: 4px; }
  .row.trash .ic { color: var(--text-2); }
  .row .count { font-size: 12px; color: var(--text-3); padding: 0 4px; }
  .rename-input {
    flex: 1; height: 26px; padding: 0 8px; border-radius: 4px;
    background: var(--control); border: 1px solid var(--stroke);
    border-bottom: 2px solid var(--accent); display: flex; align-items: center;
  }

  .tree-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px; padding: 0 24px 40px; color: var(--text-2);
  }
  .tree-empty .big { width: 40px; height: 40px; color: var(--text-3); margin-bottom: 4px; }
  .tree-empty strong { color: var(--text); font-size: 15px; font-weight: 600; }
  .tree-empty .actions { display: flex; gap: 8px; margin-top: 8px; }

  /* ---------- Divisor ---------- */
  .divider { cursor: col-resize; position: relative; }
  .divider::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
    background: transparent; transition: background 0.15s;
  }
  .divider:hover::after, .divider.dragging::after { background: var(--accent); }

  /* ---------- Editor ---------- */
  .editor-pane {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--layer);
    border-top: 1px solid var(--stroke);
    border-left: 1px solid var(--stroke);
    border-top-left-radius: 8px;
  }
  .editor-head {
    display: flex; align-items: center; gap: 4px;
    height: 48px; padding: 0 12px 0 28px; flex: none;
  }
  .crumbs { display: flex; align-items: center; gap: 2px; color: var(--text-2); font-size: 13px; min-width: 0; }
  .crumbs span.seg { padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
  .crumbs span.seg:hover { background: var(--hover); }
  .crumbs svg { width: 12px; height: 12px; color: var(--text-3); flex: none; }
  .crumbs .root { color: var(--text-3); }
  .badge {
    margin-left: 8px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px;
    background: var(--hover); color: var(--text-2); border: 1px solid var(--stroke);
  }
  .editor-head .spacer { flex: 1; }
  .fav-btn svg { color: var(--text-2); }
  .fav-btn.on svg { color: var(--star); }

  .infobar {
    display: flex; align-items: center; gap: 10px;
    margin: 0 28px 8px; padding: 8px 12px;
    border-radius: 4px; border: 1px solid var(--stroke);
    font-size: 13px;
  }
  .infobar svg { width: 16px; height: 16px; flex: none; }
  .infobar.error { background: var(--danger-bg); }
  .infobar.error > svg { color: var(--danger); }
  .infobar .msg { flex: 1; }
  .infobar .msg b { font-weight: 600; }
  .infobar .btn { height: 28px; }

  .doc {
    flex: 1; min-height: 0; overflow: auto;
    padding: 12px 28px 24px;
    display: flex; flex-direction: column;
  }
  .doc-inner { max-width: 760px; width: 100%; display: flex; flex-direction: column; flex: 1; }
  .title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 600; line-height: 1.25;
    padding: 4px 0 6px;
    outline: none;
  }
  .title.placeholder { color: var(--text-3); }
  .title .caret, .content .caret {
    display: inline-block; width: 1.5px; height: 1.1em; background: var(--text);
    vertical-align: text-bottom; margin-left: 1px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .field-hint { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--warning); margin: 0 0 6px; }
  .field-hint svg { width: 14px; height: 14px; }
  .rule { height: 1px; background: var(--stroke); margin: 6px 0 14px; }
  .content {
    flex: 1;
    font-size: 15px; line-height: 1.65;
    white-space: pre-wrap;
    color: var(--text);
  }
  .content.placeholder { color: var(--text-3); }

  .usage { color: var(--text-3); font-size: 12.5px; margin: 0 0 2px; }
  .folder-meta { color: var(--text-2); font-size: 13.5px; margin: 0 0 18px; }
  .folder-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Painel de seleção e lixeira */
  .item-list { margin-top: 22px; border-top: 1px solid var(--stroke); }
  .item-list .li {
    display: grid; grid-template-columns: 16px 1fr auto auto; align-items: center; column-gap: 10px;
    min-height: 36px; padding: 0 8px; border-bottom: 1px solid var(--stroke); border-radius: 4px;
  }
  .item-list .li.selected { background: var(--selected); }
  .item-list .li svg { width: 16px; height: 16px; color: var(--text-2); }
  .item-list .li.folder > svg { color: #c69a2b; }
  .theme-dark .item-list .li.folder > svg { color: #e8c15c; }
  .item-list .li .sub { display: block; font-size: 12px; color: var(--text-3); }
  .item-list .li .from { font-size: 12.5px; color: var(--text-2); }
  .item-list .li .when { font-size: 12px; color: var(--text-3); min-width: 110px; text-align: right; }
  .item-list.trash .li { grid-template-columns: 16px 1fr 170px 120px 64px; }
  .item-list .li .acts { display: flex; gap: 2px; justify-content: flex-end; visibility: hidden; }
  .item-list .li:hover .acts, .item-list .li.selected .acts { visibility: visible; }
  .item-list .li .acts .btn { height: 28px; }
  .item-list .head { font-size: 12px; color: var(--text-3); min-height: 28px; border-bottom: 1px solid var(--stroke); }

  .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px 40px; max-width: 640px; }
  .welcome h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin: 0 0 8px; }
  .welcome p { color: var(--text-2); margin: 0 0 24px; line-height: 1.55; }
  .steps { display: grid; gap: 14px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step .n {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 12.5px; font-weight: 600;
    background: var(--accent-soft); color: var(--text);
  }
  .step b { display: block; font-weight: 600; margin-bottom: 2px; }
  .step span { color: var(--text-2); font-size: 13px; }

  .empty-editor { flex: 1; display: grid; place-items: center; color: var(--text-3); }

  /* ---------- Barra de estado ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    font-size: 12px; color: var(--text-2);
    border-top: 1px solid var(--stroke);
    background: var(--base);
  }
  .statusbar svg { width: 14px; height: 14px; flex: none; }
  .statusbar .ok svg { color: var(--success); }
  .statusbar .warn { color: var(--warning); }
  .statusbar .err { color: var(--danger); }
  .statusbar .st { display: flex; align-items: center; gap: 6px; }
  .statusbar a { color: var(--accent); text-decoration: none; margin-left: 4px; }
  .statusbar .right { margin-left: auto; color: var(--text-3); }
  .spinner {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--stroke-strong); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Menus ---------- */
  .menu {
    position: absolute; z-index: 10;
    min-width: 230px; padding: 4px;
    background: var(--layer-alt);
    border: 1px solid var(--stroke-strong);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .menu .item {
    display: flex; align-items: center; gap: 10px;
    height: 32px; padding: 0 10px; border-radius: 4px;
  }
  .menu .item:hover, .menu .item.hl { background: var(--hover); }
  .menu .item svg { width: 16px; height: 16px; color: var(--text-2); }
  .menu .item .kb { margin-left: auto; font-size: 12px; color: var(--text-3); }
  .menu .item.danger, .menu .item.danger svg { color: var(--danger); }
  .menu .item.off { opacity: 0.4; }
  .menu .sep { height: 1px; background: var(--stroke); margin: 4px 0; }
  .menu .hint { font-size: 12px; color: var(--text-3); padding: 4px 10px 6px; }
  .menu .item svg.sub { margin-left: auto; width: 12px; height: 12px; color: var(--text-3); }

  /* ---------- Notificações (Toast no canto inferior direito) ---------- */
  .toasts {
    position: absolute; z-index: 15; right: 16px; bottom: 40px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .toast {
    width: 340px;
    display: grid; grid-template-columns: 20px 1fr 20px; column-gap: 10px;
    padding: 12px; border-radius: 4px;
    background: var(--layer); border: 1px solid var(--stroke-strong); box-shadow: var(--shadow);
    font-size: 13px; line-height: 1.45;
    animation: toast-in 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) both;
  }
  .toast.leaving { animation: toast-out 0.2s ease-in both; }
  .toast > svg { width: 20px; height: 20px; }
  .toast.success > svg:first-child { color: var(--success); }
  .toast.error > svg:first-child { color: var(--danger); }
  .toast .t { font-weight: 600; }
  .toast .b { grid-column: 2; color: var(--text-2); }
  .toast .b ul { margin: 2px 0 0; padding-left: 18px; }
  .toast > svg.close { width: 16px; height: 16px; color: var(--text-2); margin: 2px 0 0 4px; }
  .toast.undo { grid-template-columns: 20px 1fr auto; align-items: center; }
  .toast.undo > svg:first-child { color: var(--text-2); }
  .toast .action { color: var(--accent); font-weight: 600; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(24px); } }

  /* ---------- Diálogo ---------- */
  .overlay { position: absolute; inset: 0; z-index: 20; background: var(--overlay); display: grid; place-items: center; }
  .dialog {
    width: 448px; border-radius: 8px; overflow: hidden;
    background: var(--layer); border: 1px solid var(--stroke-strong); box-shadow: var(--shadow);
  }
  .dialog .dbody { padding: 24px; }
  .dialog h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  .dialog p { margin: 0 0 8px; color: var(--text-2); line-height: 1.5; }
  .dialog ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); }
  .dialog .dfoot {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 20px 24px; background: var(--layer-alt); border-top: 1px solid var(--stroke);
  }
  .dialog .dfoot .btn { justify-content: center; }

  svg.i { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  svg.f { fill: currentColor; stroke: none; }
  .window.with-update { grid-template-rows: 32px auto 1fr 28px; }
  .update-bar {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;

    },
    "favoritos": {
      label: "Filtro: favoritos",
      note: "O filtro de favoritos reduz a árvore aos textos marcados, preservando as pastas onde estão.",
      selected: "saudacao", favFilter: true, status: { kind: "ok" },
    },
    "confirmacao": {
      label: "Excluir definitivamente",
      note: "Shift+Del exclui sem passar pela lixeira: pede confirmação e informa o que será removido junto.",
      selected: "trabalho", folderView: "trabalho", dialog: "permanent", status: { kind: "ok" },
    },
    "erro": {
      label: "Erro ao salvar",
      note: "Falha na gravação: o texto digitado continua no editor, o item fica marcado e é possível tentar de novo. Nova edição também tenta de novo.",
      selected: "resposta", editedContent: true, error: true, status: { kind: "error" }, dot: "err",
    },
    "atualizacao": {
      label: "Versão nova",
      note: "A verificação de atualização encontrou uma versão mais nova: a barra fica no topo até Dispensar (vale para aquela versão) ou até instalar a versão nova. Abrir página da release abre o navegador.",
      selected: "resposta", update: true, status: { kind: "ok" },
    },
  };

  let current = "edicao";
  let theme = "claro";
  let treeWidth = 290;

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const norm = (s) => s.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

  function find(id, nodes = LIB, path = []) {
    for (const n of nodes) {
      if (n.id === id) return { node: n, path };
      if (n.children) {
        const r = find(id, n.children, [...path, n]);
        if (r) return r;
      }
    }
    return null;
  }

  function countAll(nodes) {
    let texts = 0, folders = 0;
    for (const n of nodes) {
      if (n.type === "folder") { folders++; const c = countAll(n.children); texts += c.texts; folders += c.folders; }
      else texts++;
    }
    return { texts, folders };
  }

  // Mantém pastas que contenham algum texto aceito por `keep`, abrindo-as.
  function prune(nodes, keep) {
    const out = [];
    for (const n of nodes) {
      if (n.type === "folder") {
        const kids = prune(n.children, keep);
        if (kids.length) out.push({ ...n, open: true, children: kids });
      } else if (keep(n)) out.push(n);
    }
    return out;
  }

  function highlight(text, q) {
    if (!q) return esc(text);
    const i = norm(text).indexOf(norm(q));
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  }

  function excerpt(content, q) {
    const i = norm(content).indexOf(norm(q));
    const start = Math.max(0, i - 18);
    const piece = content.slice(start, i + q.length + 40).replace(/\n/g, " ");
    return (start > 0 ? "…" : "") + highlight(piece, q);
  }

  function treeRows(nodes, depth, st) {
    let html = "";
    for (const n of nodes) {
      if (st.hidden?.includes(n.id)) continue;
      const sel = st.selected === n.id || !!st.multi?.includes(n.id);
      const ctx = st.context === n.id || (st.multiContext && st.selected === n.id);
      const extra = (st.cut?.includes(n.id) ? " cut" : "") + (st.drop?.into === n.id ? " drop-into" : "");
      if (st.drop?.before === n.id) html += `<div class="drop-line" style="--depth:${depth}"></div>`;
      if (n.type === "folder") {
        html += `<div class="row folder${sel ? " selected" : ""}${st.folderContext === n.id ? " context" : ""}${extra}" style="--depth:${depth}">
          <span class="tw">${ic(n.open ? "chev-d" : "chev-r")}</span>
          <svg class="i ic"><use href="#i-${n.open ? "folder-open" : "folder"}"/></svg>
          <span class="label"><span class="name">${esc(n.name)}</span></span>
          <span class="more">${ic("more", "f")}</span>
        </div>`;
        if (n.open) html += treeRows(n.children, depth + 1, st);
        if (n.id === "emails" && st.draft) {
          html += `<div class="row draft selected" style="--depth:${depth + 1}">
            <span class="tw"></span>${ic("doc").replace('class="i"', 'class="i ic"')}
            <span class="label"><span class="name">Sem título</span></span>
            <span class="dot pending" title="Rascunho não salvo"></span>
          </div>`;
        }
      } else {
        const matchTitle = st.query && norm(n.title).includes(norm(st.query));
        const showExcerpt = st.query && !matchTitle;
        const dot = sel && st.dot ? `<span class="dot ${st.dot}"></span>` : "";
        html += `<div class="row text${sel ? " selected" : ""}${ctx ? " context" : ""}${extra}" style="--depth:${depth}">
          <span class="tw"></span>
          <svg class="i ic"><use href="#i-doc"/></svg>
          <span class="label">
            <span class="name">${sel && st.invalidTitle ? '<span style="color:var(--text-3);font-style:italic">Sem título</span>' : highlight(n.title, st.query)}</span>
            ${showExcerpt ? `<span class="excerpt">${excerpt(n.content, st.query)}</span>` : ""}
          </span>
          ${dot}
          ${n.fav ? `<svg class="f star"><use href="#i-star"/></svg>` : ""}
          <span class="more">${ic("more", "f")}</span>
        </div>`;
        if (st.insert?.after === n.id) html += treeRows([st.insert.node], depth, st);
      }
    }
    return html;
  }

  // Pasta Histórico fixa no topo: sem menu de contexto, sem arrastar nem seleção múltipla.
  function historyRows(st) {
    let html = `<div class="row folder" style="--depth:0">
      <span class="tw">${ic(st.histOpen ? "chev-d" : "chev-r")}</span>
      <svg class="i ic"><use href="#i-history"/></svg>
      <span class="label"><span class="name">Histórico</span></span>
    </div>`;
    if (!st.histOpen) return html;
    for (const h of HIST) {
      if (st.hidden?.includes(h.id)) continue;
      const icon = h.kind === "image" ? `<span class="thumb"></span>` : `<svg class="i ic"><use href="#i-doc"/></svg>`;
      html += `<div class="row text${st.selected === h.id ? " selected" : ""}" style="--depth:1">
        <span class="tw"></span>${icon}
        <span class="label"><span class="name">${esc(h.title)}</span></span>
        <span class="count">${h.at}</span>
      </div>`;
    }
    return html;
  }

  function renderTree(st) {
    const head = `
      <div class="tree-head">
        <div class="search${st.query ? " active" : ""}">
          ${ic("search")}
          ${st.query ? `<span class="q">${esc(st.query)}<span class="caret"></span></span><span class="clear">${ic("x")}</span>` : "<span>Buscar</span>"}
        </div>
        <button class="btn accent">${ic("add")} Novo ${ic("chev-d").replace('class="i"', 'class="i chev"')}</button>
        <button class="btn subtle icon" title="Importar e exportar">${ic("more", "f")}</button>
      </div>`;

    if (st.empty) {
      return head + `
        <div class="tree-empty">
          <svg class="i big"><use href="#i-docs"/></svg>
          <strong>Nenhum texto ainda</strong>
          <span>Crie um texto para colar em qualquer programa, ou uma pasta para organizar.</span>
          <div class="actions">
            <button class="btn accent">${ic("doc-add")} Novo texto</button>
            <button class="btn">${ic("folder-add")} Nova pasta</button>
          </div>
        </div>`;
    }

    let nodes = LIB;
    let info = "";
    if (st.query) {
      nodes = prune(LIB, (t) => norm(t.title + " " + t.content).includes(norm(st.query)));
      const n = countAll(nodes).texts;
      info = `<span class="results-info">${n} resultado${n === 1 ? "" : "s"}</span>`;
    } else if (st.favFilter) {
      nodes = prune(LIB, (t) => t.fav);
    }

    let rows = (st.query || st.favFilter ? "" : historyRows(st)) + treeRows(nodes, 0, st);
    if (st.renaming) {
      // Itens novos entram no fim: a nova pasta vem depois das pastas da raiz e antes dos textos.
      const firstRootText = rows.indexOf('<div class="row text" style="--depth:0">');
      rows = rows.slice(0, firstRootText) + `<div class="row folder selected" style="--depth:0">
          <span class="tw"></span><svg class="i ic"><use href="#i-folder"/></svg>
          <span class="rename-input">Nova pasta<span class="caret" style="display:inline-block;width:1px;height:15px;background:var(--text);margin-left:1px"></span></span>
        </div>` + rows.slice(firstRootText);
    }

    return head + `
      <div class="chips">
        <span class="chip${st.favFilter ? " on" : ""}">${st.favFilter ? icFill("star") : ic("star")} Favoritos</span>
        ${info}
      </div>
      <div class="tree">${rows}</div>
      <div class="tree-foot">
        <div class="row trash${st.selected === "lixeira" ? " selected" : ""}" style="--depth:0">
          <span class="tw"></span><svg class="i ic"><use href="#i-trash"/></svg>
          <span class="label"><span class="name">Lixeira</span></span>
          <span class="count">${st.trashCount ?? TRASH.length}</span>
        </div>
      </div>`;
  }

  // Na raiz, o caminho diz "Sem pasta" para textos e "Raiz" para pastas.
  function crumbs(path, extra, rootLabel = "Sem pasta") {
    const segs = path.map((p) => `<span class="seg">${esc(p.name)}</span>`);
    if (!segs.length) segs.push(`<span class="seg root">${rootLabel}</span>`);
    return `<div class="crumbs">${segs.join(ic("chev-r"))}${extra || ""}</div>`;
  }

  function renderEditor(st) {
    if (st.empty) {
      return `<div class="welcome">
        <h1>Bem-vindo ao CSTM</h1>
        <p>Cadastre os textos que você digita toda hora e cole-os em qualquer programa pelo menu de colagem, sem sair do que está fazendo.</p>
        <div class="steps">
          <div class="step"><span class="n">1</span><div><b>Crie textos</b><span>Saudações, assinaturas, respostas prontas, endereços.</span></div></div>
          <div class="step"><span class="n">2</span><div><b>Organize em pastas</b><span>Agrupe por assunto e marque os mais usados como favoritos.</span></div></div>
          <div class="step"><span class="n">3</span><div><b>Cole com o atalho</b><span>O menu de colagem abre junto ao cursor em qualquer programa.</span></div></div>
        </div>
      </div>`;
    }

    const hist = HIST.find((h) => h.id === st.selected);
    if (hist) {
      const meta = `Copiado ${hist.copied}${hist.kind === "image" ? ` · ${hist.title}` : ""}`;
      const body = hist.kind === "image"
        ? `<div class="hist-image">640 × 480</div>`
        : `<div class="content">${st.histEmptied ? "" : esc(hist.content).replace(/
/g, "<br>")}</div>`;
      return `
        <div class="editor-head"><div class="crumbs"><span class="seg">Histórico</span></div><span class="spacer"></span>
          <button class="btn" title="Excluir (Del)">${ic("trash")} Excluir</button></div>
        <div class="doc"><div class="doc-inner">
          <p class="folder-meta">${meta}</p>
          ${hist.formatted && !st.histEmptied ? `<div class="hist-info">${ic("info")} Editar remove a formatação que veio junto (negrito, links…); o texto continua.</div>` : ""}
          ${st.histEmptied ? `<div class="hist-info warn">${ic("warn")} Um item do histórico não pode ficar vazio.</div>` : ""}
          <div class="rule"></div>
          ${body}
        </div></div>`;
    }

    if (st.selected === "lixeira") {
      const rows = TRASH.map((t, i) => `
        <div class="li ${t.type}${st.trashSelected === i ? " selected" : ""}">
          ${ic(t.type === "folder" ? "folder" : t.type === "clip" ? "history" : "doc")}
          <span>${esc(t.title ?? t.name)}${t.info ? `<span class="sub">Pasta com ${t.info}</span>` : ""}</span>
          <span class="from">${esc(t.from)}</span>
          <span class="when">${t.at}</span>
          <span class="acts">
            <button class="btn subtle icon" title="Restaurar">${ic("restore")}</button>
            <button class="btn subtle icon" title="Excluir definitivamente">${ic("trash")}</button>
          </span>
        </div>`).join("");
      return `
        <div class="editor-head"><div class="crumbs"><span class="seg">Lixeira</span></div><span class="spacer"></span></div>
        <div class="doc"><div class="doc-inner">
          <div class="title">Lixeira</div>
          <p class="folder-meta">${TRASH.length} itens. Na lixeira, eles não aparecem no menu de colagem, na busca nem nas exportações.</p>
          <div class="folder-actions">
            <button class="btn">${ic("restore")} Restaurar</button>
            <button class="btn">${ic("trash")} Excluir definitivamente</button>
            <span style="flex:1"></span>
            <button class="btn">Esvaziar lixeira</button>
          </div>
          <div class="item-list trash">
            <div class="li head"><span></span><span>Nome</span><span>Estava em</span><span style="text-align:right">Excluído em</span><span></span></div>
            ${rows}
          </div>
        </div></div>`;
    }

    if (st.multi?.length > 1) {
      const items = st.multi.map((id) => find(id));
      const texts = items.filter((f) => f.node.type === "text").length;
      const folders = items.length - texts;
      const parts = [texts && `${texts} texto${texts === 1 ? "" : "s"}`, folders && `${folders} pasta${folders === 1 ? "" : "s"}`].filter(Boolean);
      const list = items.map(({ node: n, path }) => `
        <div class="li ${n.type}">
          ${ic(n.type === "folder" ? "folder" : "doc")}
          <span>${esc(n.title ?? n.name)}</span>
          <span class="from">${esc(path.map((p) => p.name).join(" › ") || "Raiz")}</span>
          <span>${n.fav ? `<svg class="f" style="color:var(--star)"><use href="#i-star"/></svg>` : ""}</span>
        </div>`).join("");
      return `
        <div class="editor-head"><div class="crumbs"><span class="seg">Seleção</span></div><span class="spacer"></span></div>
        <div class="doc"><div class="doc-inner">
          <div class="title">${items.length} itens selecionados</div>
          <p class="folder-meta">${parts.join(" e ")}</p>
          <div class="folder-actions">
            <button class="btn">${ic("move")} Mover para…</button>
            <button class="btn">${ic("cut")} Recortar</button>
            <button class="btn">${ic("copy")} Copiar</button>
            <button class="btn">${ic("star")} Adicionar aos favoritos</button>
            <button class="btn">${ic("export")} Exportar ${ic("chev-d").replace('class="i"', 'class="i chev"')}</button>
            <button class="btn">${ic("trash")} Excluir</button>
          </div>
          <div class="item-list">${list}</div>
        </div></div>`;
    }

    if (st.folderView) {
      const isNew = st.folderView === "nova-pasta";
      const f = isNew ? { node: { name: "Nova pasta", children: [] }, path: [] } : find(st.folderView);
      const c = countAll(f.node.children);
      const meta = isNew ? "Pasta vazia" :
        `${c.texts} texto${c.texts === 1 ? "" : "s"} · ${c.folders ? c.folders + " subpasta" + (c.folders === 1 ? "" : "s") : "nenhuma subpasta"}`;
      return `
        <div class="editor-head">${crumbs(f.path, "", "Raiz")}<span class="spacer"></span>
          <button class="btn subtle icon">${ic("more", "f")}</button></div>
        <div class="doc"><div class="doc-inner">
          <div class="title">${esc(f.node.name)}</div>
          <p class="folder-meta">${meta}</p>
          <div class="folder-actions">
            <button class="btn">${ic("doc-add")} Novo texto aqui</button>
            <button class="btn">${ic("folder-add")} Nova subpasta</button>
          </div>
        </div></div>`;
    }

    if (st.draft) {
      return `
        <div class="editor-head">${crumbs(find("emails").path.concat(find("emails").node), '<span class="badge">Rascunho</span>')}
          <span class="spacer"></span>
          <button class="btn subtle icon fav-btn" title="Salve o texto para favoritar" disabled>${ic("star")}</button>
          <button class="btn subtle icon">${ic("more", "f")}</button></div>
        <div class="doc"><div class="doc-inner">
          <div class="title placeholder"><span class="caret"></span>Sem título</div>
          <div class="rule"></div>
          <div class="content placeholder">Escreva o texto que será colado…</div>
        </div></div>`;
    }

    const { node: t, path } = st.insert?.node.id === st.selected
      ? { node: st.insert.node, path: find(st.insert.after).path }
      : find(st.selected);
    let content = esc(t.content);
    if (st.editedContent) {
      content = esc(t.content.replace("\n\nAtenciosamente", "\n\nQualquer dúvida, estou à disposição.\n\nAtenciosamente"));
    }
    if (st.caret) content += '<span class="caret"></span>';

    const error = st.error ? `
      <div class="infobar error">${ic("error")}
        <span class="msg"><b>Não foi possível salvar.</b> Suas alterações continuam aqui e não foram perdidas.</span>
        <button class="btn">${ic("refresh")} Tentar novamente</button>
      </div>` : "";

    const title = st.invalidTitle
      ? `<div class="title placeholder"><span class="caret"></span>Sem título</div>
         <div class="field-hint">${ic("warn")} O título é obrigatório. Enquanto estiver vazio, as alterações não são salvas.</div>`
      : `<div class="title">${esc(t.title)}</div>
         <p class="usage">${t.uses ? `Usado ${t.uses} vez${t.uses === 1 ? "" : "es"} · último uso em ${t.lastUsed}` : "Ainda não usado"}</p>`;

    let html = `
      <div class="editor-head">${crumbs(path)}<span class="spacer"></span>
        <button class="btn subtle icon fav-btn${t.fav ? " on" : ""}" title="Favorito">${t.fav ? icFill("star") : ic("star")}</button>
        <button class="btn subtle icon">${ic("more", "f")}</button></div>
      ${error}
      <div class="doc"><div class="doc-inner">
        ${title}
        <div class="rule"></div>
        <div class="content">${content}</div>
      </div></div>`;
    return html;
  }

  function renderStatus(st) {
    const counts = st.empty ? "0 textos" : (() => { const c = countAll(LIB); return `${c.texts} textos · ${c.folders} pastas`; })();
    const s = st.status;
    let left = "";
    if (s.kind === "ok") left = `<span class="st ok">${ic("check")} Todas as alterações salvas</span>`;
    if (s.kind === "saving") left = `<span class="st"><span class="spinner"></span> Salvando…</span>`;
    if (s.kind === "draft") left = `<span class="st">${ic("info")} Rascunho: preencha o título e o conteúdo para salvar</span>`;
    if (s.kind === "invalid") left = `<span class="st warn">${ic("warn")} Não salvo: o título está vazio. A última versão salva foi mantida.</span>`;
    if (s.kind === "error") left = `<span class="st err">${ic("error")} Erro ao salvar “Resposta padrão”: banco de dados indisponível.<a href="#">Tentar novamente</a></span>`;
    if (s.kind === "idle") left = `<span class="st">${esc(s.text)}</span>`;
    return `${left}<span class="right">${counts}<span style="margin-left:16px">v0.19.0</span></span>`;
  }

  function renderMenus(st) {
    let html = "";
    if (st.newMenu) {
      html += `<div class="menu" style="left:${treeWidth - 166}px; top:76px">
        <div class="item hl">${ic("doc-add")} Novo texto <span class="kb">Ctrl+N</span></div>
        <div class="item">${ic("folder-add")} Nova pasta <span class="kb">Ctrl+Shift+N</span></div>
        <div class="sep"></div>
        <div class="hint">Em Trabalho › E-mails</div>
      </div>`;
    }
    const sub = ic("chev-r").replace('class="i"', 'class="i sub"');
    // Grupos de itens comuns aos menus de contexto.
    const clip = (canPaste) => `
        <div class="item">${ic("cut")} Recortar <span class="kb">Ctrl+X</span></div>
        <div class="item">${ic("copy")} Copiar <span class="kb">Ctrl+C</span></div>
        <div class="item${canPaste ? "" : " off"}">${ic("paste")} Colar <span class="kb">Ctrl+V</span></div>
        <div class="sep"></div>`;
    const arrange = (hl) => `
        <div class="item">${ic("rename")} Renomear <span class="kb">F2</span></div>
        <div class="item">${ic("move")} Mover para…</div>
        <div class="sep"></div>
        <div class="item${hl ? " hl" : ""}">${ic("up")} Mover para cima</div>
        <div class="item">${ic("down")} Mover para baixo</div>
        <div class="sep"></div>`;
    const remove = `<div class="item danger">${ic("trash")} Excluir <span class="kb">Del</span></div>`;
    if (st.context) {
      html += `<div class="menu" style="left:${Math.min(treeWidth - 40, 300)}px; top:236px">
        ${clip(false)}${arrange(true)}
        <div class="item">${ic("star")} Adicionar aos favoritos</div>
        <div class="sep"></div>
        ${remove}
      </div>`;
    }
    if (st.multiContext) {
      html += `<div class="menu" style="left:${Math.min(treeWidth - 40, 300)}px; top:300px">
        <div class="hint">3 itens selecionados</div>
        ${clip(false)}
        <div class="item">${ic("move")} Mover para…</div>
        <div class="sep"></div>
        <div class="item">${ic("star")} Adicionar aos favoritos</div>
        <div class="item">${ic("export")} Exportar ${sub}</div>
        <div class="sep"></div>
        ${remove}
      </div>`;
    }
    const close = ic("x").replace('class="i"', 'class="i close"');
    const formats = (left, top) => `<div class="menu" style="left:${left}px; top:${top}px">
        <div class="item hl">${ic("json")} Backup JSON…</div>
        <div class="item">${ic("docs")} Pastas e arquivos .txt…</div>
      </div>`;
    const sorts = (left, top) => `<div class="menu" style="left:${left}px; top:${top}px">
        <div class="item hl">${ic("sort")} Por nome (A–Z)</div>
        <div class="item">${ic("star")} Por mais usados</div>
        <div class="item">${ic("history")} Por uso mais recente</div>
      </div>`;
    if (st.libMenu) {
      const left = treeWidth - 40, top = 76;
      html += `<div class="menu" style="left:${left}px; top:${top}px">
        <div class="item${st.libMenu === "import" ? " hl" : ""}">${ic("import")} Importar ${sub}</div>
        <div class="item${st.libMenu === "export" ? " hl" : ""}">${ic("export")} Exportar tudo ${sub}</div>
        <div class="sep"></div>
        <div class="item${st.libMenu === "more" ? " hl" : ""}">${ic("sort")} Ordenar a raiz ${sub}</div>
        <div class="sep"></div>
        <div class="item">${ic("expand")} Expandir tudo</div>
        <div class="item">${ic("collapse")} Recolher tudo</div>
      </div>`;
      if (st.libMenu === "more") {
        html += sorts(left + 232, top + 4 + 2 * 32 + 9);
      } else if (st.libMenu === "import") {
        html += `<div class="menu" style="left:${left + 232}px; top:${top}px">
          <div class="item hl">${ic("doc")} Arquivos .txt…</div>
          <div class="item">${ic("folder")} Pasta…</div>
          <div class="item">${ic("folder-open")} Conteúdo de uma pasta…</div>
          <div class="item">${ic("json")} Backup JSON…</div>
          <div class="sep"></div>
          <div class="hint">Em Trabalho › E-mails</div>
        </div>`;
      } else {
        html += formats(left + 232, top + 32);
      }
    }
    if (st.folderContext) {
      const left = Math.min(treeWidth - 40, 300), top = 150;
      html += `<div class="menu" style="left:${left}px; top:${top}px">
        ${clip(false)}${arrange(false)}
        <div class="item${st.sortMenu ? " hl" : ""}">${ic("sort")} Ordenar ${sub}</div>
        <div class="item${st.sortMenu ? "" : " hl"}">${ic("export")} Exportar ${sub}</div>
        <div class="sep"></div>
        ${remove}
      </div>`;
      const subTop = top + 4 + 7 * 32 + 3 * 9;
      html += st.sortMenu ? sorts(left + 232, subTop) : formats(left + 232, subTop + 32);
    }
    if (st.ghost) {
      html += `<div class="drag-ghost" style="left:${Math.min(treeWidth - 120, 170)}px; top:${st.ghost.top}px">
        ${ic(st.ghost.count ? "docs" : "doc")} ${esc(st.ghost.label)}
        ${st.ghost.count ? `<span class="count">${st.ghost.count}</span>` : ""}
      </div>`;
    }
    const TOASTS = {
      imported: `<div class="toast success">${ic("check")}
        <span class="t">12 textos e 3 pastas importados em Trabalho › E-mails.</span>${close}
        <span class="b">2 arquivos ignorados:
          <ul><li>notas antigas.txt: não está em UTF-8</li><li>logo.png: não é um arquivo .txt</li></ul></span></div>`,
      exported: `<div class="toast success">${ic("check")}
        <span class="t">9 textos e 4 pastas exportados.</span>${close}
        <span class="b">C:\\Users\\gabriel\\Documents\\CSTM</span></div>`,
      error: `<div class="toast error">${ic("error")}
        <span class="t">Não foi possível importar.</span>${close}
        <span class="b">O arquivo não é um backup do CSTM. Nada foi importado.</span></div>`,
      trashed: `<div class="toast undo">${ic("trash")}
        <span class="t">2 itens movidos para a lixeira.</span>
        <span class="action">Desfazer</span></div>`,
      "hist-trash": `<div class="toast undo">${ic("trash")}
        <span class="t">Item do histórico movido para a lixeira.</span>
        <span class="action">Desfazer</span></div>`,
    };
    if (st.toasts) {
      html += `<div class="toasts">${st.toasts.map((t) => TOASTS[t]).join("")}</div>`;
    }
    if (st.dialog === "permanent") {
      html += `<div class="overlay"><div class="dialog">
        <div class="dbody">
          <h2>Excluir definitivamente a pasta “Trabalho”?</h2>
          <p>Também serão excluídos:</p>
          <ul><li>2 subpastas (E-mails, Clientes)</li><li>6 textos, incluindo 2 favoritos</li></ul>
          <p style="margin-top:12px">Esta ação não pode ser desfeita. Para poder recuperar depois, use Excluir (Del), que move para a lixeira.</p>
        </div>
        <div class="dfoot"><button class="btn danger">Excluir definitivamente</button><button class="btn">Cancelar</button></div>
      </div></div>`;
    }
    if (st.dialog === "empty") {
      html += `<div class="overlay"><div class="dialog">
        <div class="dbody">
          <h2>Esvaziar a lixeira?</h2>
          <p>Os 3 itens da lixeira serão excluídos definitivamente, incluindo 1 pasta com 3 textos.</p>
          <p>Esta ação não pode ser desfeita.</p>
        </div>
        <div class="dfoot"><button class="btn danger">Esvaziar lixeira</button><button class="btn">Cancelar</button></div>
      </div></div>`;
    }
    return html;
  }

  function render() {
    const st = STATES[current];
    const win = document.getElementById("win");
    win.className = "window " + (theme === "escuro" ? "theme-dark" : "theme-light") + (st.update ? " with-update" : "");
    win.innerHTML = `
      <div class="titlebar"><span class="app-icon">C</span> CSTM
        <div class="controls"><span>${ic("min")}</span><span>${ic("max")}</span><span>${ic("x")}</span></div></div>
      ${st.update ? `<div class="update-bar"><span>Versão 0.19.0 do CSTM disponível.</span><button class="btn">Abrir página da release</button><button class="btn">Dispensar</button></div>` : ""}
      <div class="body" style="--tree-w:${treeWidth}px">
        <aside class="tree-pane">${renderTree(st)}</aside>
        <div class="divider" id="divider" title="Arraste para redimensionar"></div>
        <section class="editor-pane">${renderEditor(st)}</section>
      </div>
      <div class="statusbar">${renderStatus(st)}</div>
      ${renderMenus(st)}`;
    document.getElementById("note").textContent = st.note;
    document.querySelectorAll("#states button[data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === current));
    document.querySelectorAll("#states button[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === theme));
    bindDivider();
    history.replaceState(null, "", `#estado=${current}&tema=${theme}`);
  }

  function bindDivider() {
    const d = document.getElementById("divider");
    d.addEventListener("pointerdown", (e) => {
      d.setPointerCapture(e.pointerId);
      d.classList.add("dragging");
      const startX = e.clientX, startW = treeWidth;
      const move = (ev) => {
        treeWidth = Math.max(220, Math.min(480, startW + ev.clientX - startX));
        document.querySelector(".body").style.setProperty("--tree-w", treeWidth + "px");
      };
      const up = () => { d.removeEventListener("pointermove", move); d.removeEventListener("pointerup", up); render(); };
      d.addEventListener("pointermove", move);
      d.addEventListener("pointerup", up);
    });
  }

  const bar = document.getElementById("states");
  bar.innerHTML =
    Object.entries(STATES).map(([k, v]) => `<button data-s="${k}">${v.label}</button>`).join("") +
    `<span class="sep"></span><button data-t="claro">Claro</button><button data-t="escuro">Escuro</button>` +
    `<span class="sep"></span><button data-r>Reexibir</button>`;
  bar.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.s) current = b.dataset.s;
    if (b.dataset.t) theme = b.dataset.t;
    if (b.dataset.r !== undefined) {
      // Mostra a saída e a entrada das notificações de novo.
      document.querySelectorAll(".toast").forEach((t) => t.classList.add("leaving"));
      setTimeout(render, 250);
      return;
    }
    render();
  });

  const params = new URLSearchParams(location.hash.slice(1));
  if (STATES[params.get("estado")]) current = params.get("estado");
  if (params.get("tema") === "escuro") theme = "escuro";
  render();
</script>
</body>
</html>
