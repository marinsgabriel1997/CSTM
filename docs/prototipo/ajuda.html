<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>CSTM — Protótipo da Ajuda</title>
<!--
  Protótipo estático da página Ajuda (Tela 4 de docs/telas.md), na área do editor do cadastro.
  Não faz parte do aplicativo: abre direto no navegador, sem build. O texto é o mesmo de
  src/helpContent.ts, e as imagens são as de src/assets/ajuda/ (geradas por npm run ajuda:imagens). Estados pela barra superior ou pela URL: ajuda.html#estado=avancado&tema=escuro
-->
<style>
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }

  .theme-light {
    --base: #eef0f3;
    --layer: #ffffff;
    --stroke: rgba(0, 0, 0, 0.08);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1a1a1a;
    --text-2: #5d5d5d;
    --text-3: #8b8b8b;
    --hover: rgba(0, 0, 0, 0.04);
    --accent: #005fb8;
    --on-accent: #ffffff;
    --danger: #c42b1c;
    --danger-bg: #fde7e9;
    --warning: #8a5300;
    --warning-bg: #fff4ce;
    --success: #0f7b0f;
    --overlay: rgba(0, 0, 0, 0.3);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.14), 0 0 1px rgba(0, 0, 0, 0.2);
    --control: #ffffff;
    --keycap: #f3f3f3;
  }

  .theme-dark {
    --base: #1c1c1c;
    --layer: #2b2b2b;
    --stroke: rgba(255, 255, 255, 0.07);
    --stroke-strong: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-2: #c8c8c8;
    --text-3: #9a9a9a;
    --hover: rgba(255, 255, 255, 0.05);
    --accent: #60cdff;
    --on-accent: #000000;
    --danger: #ff99a4;
    --danger-bg: #442726;
    --warning: #fce100;
    --warning-bg: #433519;
    --success: #6ccb5f;
    --overlay: rgba(0, 0, 0, 0.5);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 1px rgba(0, 0, 0, 0.6);
    --control: #2d2d2d;
    --keycap: #3a3a3a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 24px 40px;
    font-family: var(--font);
    font-size: 14px;
    background: #d9dce1;
    color: #1a1a1a;
  }

  /* ---------- Painel do protótipo ---------- */
  .proto-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 10px;
  }
  .proto-bar button {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 10px;
    border: 1px solid #b9bdc4;
    border-radius: 999px;
    background: #f4f5f7;
    cursor: pointer;
  }
  .proto-bar button.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  .proto-bar .sep { width: 1px; height: 20px; background: #b9bdc4; margin: 0 6px; }
  .proto-note { max-width: 900px; margin: 0 auto 14px; font-size: 13px; color: #374151; min-height: 20px; }

  /* ---------- Janela de cadastro ao fundo ---------- */
  .window {
    position: relative;
    width: 900px;
    height: 560px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: 32px 1fr 28px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--base);
    color: var(--text);
    border: 1px solid var(--stroke-strong);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .titlebar { display: flex; align-items: center; padding-left: 12px; font-size: 12px; color: var(--text-2); }
  .content { display: grid; grid-template-columns: 290px 1fr; }
  .tree { border-right: 1px solid var(--stroke); padding: 12px; color: var(--text-3); font-size: 13px; }
  .editor { background: var(--layer); padding: 24px; color: var(--text-3); font-size: 13px; }
  .statusbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 6px 0 12px;
    font-size: 12px;
    color: var(--text-2);
    border-top: 1px solid var(--stroke);
  }
  /* Rodapé do painel: Lixeira e as páginas Ajuda, Configurações e Sobre o CSTM (Tela 1). */
  .tree { display: flex; flex-direction: column; }
  .tree .placeholder { flex: 1; }
  .tree-foot { border-top: 1px solid var(--stroke); padding-top: 4px; margin: 0 -4px; }
  .tree-foot .pages { border-top: 1px solid var(--stroke); margin-top: 4px; padding-top: 4px; }
  .page-row {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px;
    border: none; border-radius: 4px; background: transparent; color: var(--text);
    font: inherit; font-size: 14px; text-align: left; text-decoration: none; cursor: pointer;
  }
  .page-row:hover, .page-row.pressed { background: var(--hover); }
  .page-row .ic { width: 16px; text-align: center; color: var(--text-2); }
  .page-row .count { margin-left: auto; color: var(--text-3); font-size: 12px; }
  .statusbar .totals { margin-left: auto; color: var(--text-3); }
  .statusbar .version { color: var(--text-3); padding-right: 6px; }
  .icon-button {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: var(--text-2);
    font-size: 14px;
    cursor: pointer;
  }
  .icon-button:hover, .icon-button.pressed { background: var(--hover); color: var(--text); }

  /* ---------- Página na área do editor ---------- */
  .editor.page-host { padding: 0; overflow-y: auto; color: var(--text); font-size: 14px; }
  .editor { min-height: 0; }
  .content { min-height: 0; }
  .page { max-width: 600px; padding: 24px 32px 32px; }
  .restore-row { margin-top: 10px; }
  .dialog-head { display: flex; align-items: center; margin-bottom: 20px; }
  .dialog-head h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .dialog-head .icon-button { margin-left: auto; }
  .setting-title { font-weight: 600; }
  .setting-help { margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
  .shortcut-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .shortcut-field {
    flex: 1;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--stroke-strong);
    border-bottom: 1px solid var(--text-3);
    background: var(--control);
  }
  .shortcut-field { outline: none; }
  .shortcut-field.recording { border-bottom: 2px solid var(--accent); }
  .shortcut-field .placeholder { color: var(--text-3); }
  kbd {
    font: inherit;
    font-size: 13px;
    min-width: 26px;
    padding: 2px 7px;
    text-align: center;
    border-radius: 4px;
    border: 1px solid var(--stroke-strong);
    border-bottom-width: 2px;
    background: var(--keycap);
  }
  .plus { color: var(--text-3); font-size: 12px; }
  .button {
    font: inherit;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--stroke-strong);
    background: var(--control);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .button:disabled { opacity: 0.45; cursor: default; }
  .line { margin-top: 8px; font-size: 12.5px; }
  .line.hint { color: var(--text-2); }
  .line.success { color: var(--success); }
  .bar { margin-top: 12px; padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.4; }
  .bar.error { background: var(--danger-bg); color: var(--text); border-left: 3px solid var(--danger); }
  .bar.warning { background: var(--warning-bg); color: var(--text); border-left: 3px solid var(--warning); }
  .dialog-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
  .setting-sep { height: 1px; margin: 20px 0 16px; background: var(--stroke); }
  .radio-group { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .radio { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
  .radio:hover { background: var(--hover); }
  .radio input { position: absolute; opacity: 0; }
  .radio-dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--text-2); background: var(--control);
    display: grid; place-items: center; flex: none;
  }
  .radio input:checked + .radio-dot { border-color: var(--accent); }
  .radio input:checked + .radio-dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .radio input:focus-visible + .radio-dot { outline: 2px solid var(--accent); outline-offset: 2px; }
  .radio-note { margin-left: 4px; font-size: 12px; color: var(--text-3); }
  .radio-group.row { flex-direction: row; gap: 12px; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .switch-track {
    width: 40px; height: 20px; border-radius: 10px; flex: none; position: relative;
    border: 1px solid var(--text-2); background: var(--control);
  }
  .switch-track::after {
    content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--text-2); transition: left 0.1s;
  }
  .switch input:checked + .switch-track { background: var(--accent); border-color: transparent; }
  .switch input:checked + .switch-track::after { left: 23px; background: var(--on-accent); }
  .switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch-help { margin: 4px 0 0 50px; font-size: 12px; color: var(--text-2); }
  .history-actions { display: flex; align-items: center; gap: 8px; margin: 10px 0 0 50px; }
  .history-actions .line { margin-top: 0; }
  .confirm { margin: 10px 0 0 50px; }
  .confirm .buttons { display: flex; gap: 8px; margin-top: 8px; }
  .button.danger { background: #c42b1c; color: #fff; border-color: transparent; }

  /* ---------- Menu da bandeja (estado próprio) ---------- */
  .tray-menu {
    position: absolute;
    right: 24px;
    bottom: 40px;
    width: 200px;
    padding: 4px;
    border-radius: 8px;
    background: var(--layer);
    border: 1px solid var(--stroke-strong);
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .tray-menu div { padding: 6px 10px; border-radius: 4px; }
  .tray-menu .on { background: var(--hover); }
  .tray-menu hr { border: none; border-top: 1px solid var(--stroke); margin: 4px 0; }

  a.icon-button { text-decoration: none; }
  .tabs { display: flex; gap: 4px; margin: 4px 0 20px; border-bottom: 1px solid var(--stroke); }
  .tab {
    font: inherit; padding: 8px 12px; border: none; background: transparent; color: var(--text-2);
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .steps li { display: flex; gap: 12px; }
  .num {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 13px;
  }
  .step-title { font-weight: 600; display: block; }
  .step-body { min-width: 0; flex: 1; }
  /* Título, busca e abas ficam parados no topo enquanto o conteúdo rola. */
  .help-head { position: sticky; top: 0; z-index: 1; background: var(--layer); padding-top: 24px; margin-top: -24px; }
  .help-head .tabs { margin-bottom: 0; }
  .help-head + div, .help-head + div + div { padding-top: 20px; }
  /* Busca na Ajuda: campo acima das abas, contador e anterior/próxima. */
  .help-search { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; }
  .help-search .search-box {
    flex: 1; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px;
    border: 1px solid var(--stroke-strong); background: var(--layer); color: var(--text-3);
  }
  .help-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font: inherit; }
  .help-search .hits { min-width: 96px; text-align: right; font-size: 12px; color: var(--text-3); }
  .help-search .icon-button:disabled { opacity: 0.4; cursor: default; }
  .tab-count {
    margin-left: 6px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 600;
    background: var(--accent); color: var(--on-accent);
  }
  .tab-count.zero { background: var(--hover); color: var(--text-3); }
  .tab-count.none { display: none; }
  mark.hit { background: #fff1a8; color: inherit; border-radius: 2px; }
  .theme-dark mark.hit { background: rgba(255, 214, 10, 0.3); }
  mark.hit.current, .theme-dark mark.hit.current { background: #ffb900; color: #000; }
  /* Imagens da Ajuda: capturas do tema claro, nos dois temas; a borda separa a imagem da página. */
  .help-img {
    display: block; max-width: 100%; height: auto; margin: 10px 0 6px;
    border: 1px solid var(--stroke-strong); border-radius: 8px;
  }
  /* Número da marcação: o mesmo círculo vermelho das imagens. */
  .mark-num {
    display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
    background: #d13438; color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px;
  }
  /* Barra de tarefas do Windows com a bandeja (estado Encerrar). */
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center;
    justify-content: flex-end; gap: 4px; padding: 0 12px; background: #f3f3f3; border-top: 1px solid #dcdcdc;
    font-size: 12px; color: #1a1a1a;
  }
  .taskbar .tray-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; color: #444; }
  .taskbar .tray-icon.on { background: #e0e0e0; }
  .taskbar .cstm { width: 16px; height: 16px; border-radius: 4px; background: #0f6cbd; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .taskbar .clock { margin-left: 8px; text-align: right; line-height: 1.25; }
  .tray-menu.above-tray { bottom: 46px; right: 96px; }
  .desktop { position: absolute; inset: 0; background: linear-gradient(135deg, #cfe0f1, #e8eef6); }
  .step-text, .section p { color: var(--text-2); line-height: 1.5; }
  .intro { color: var(--text-2); margin: 0 0 16px; line-height: 1.5; }
  .section { margin-bottom: 18px; }
  .section h3 { margin: 0 0 6px; font-size: 15px; }
  .section p { margin: 0 0 6px; }
  kbd { font-size: 12px; min-width: 0; padding: 0 5px; }
  .about-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .app-icon { width: 64px; height: 64px; }
  .about-name { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0; }
  .about-sub { color: var(--text-2); }
  .field-label { font-weight: 600; margin-top: 18px; }
  .path {
    margin-top: 4px; padding: 6px 10px; border-radius: 4px; background: var(--keycap);
    font-family: Consolas, monospace; font-size: 12.5px; word-break: break-all;
  }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .license { margin-top: 24px; color: var(--text-2); font-size: 12.5px; }
</style>
</head>
<body>

<div class="proto-bar" id="states"></div>
<div class="proto-note" id="note"></div>

<div class="window" id="window">
  <div class="titlebar">CSTM</div>
  <div class="content">
    <div class="tree">
      <span class="placeholder">Árvore de pastas e textos</span>
      <div class="tree-foot">
        <div class="page-row" style="cursor: default"><span class="ic" aria-hidden="true">🗑</span>Lixeira<span class="count">4</span></div>
        <div class="pages">
          <button class="page-row" id="help" title="Ajuda (F1)"><span class="ic" aria-hidden="true">?</span>Ajuda</button>
          <a class="page-row" href="configuracoes.html" title="Configurações"><span class="ic" aria-hidden="true">⚙</span>Configurações</a>
          <a class="page-row" href="sobre.html" title="Sobre o CSTM"><span class="ic" aria-hidden="true">i</span>Sobre o CSTM</a>
        </div>
      </div>
    </div>
    <div class="editor page-host" id="editor"></div>
  </div>
  <div class="statusbar">
    <span>✓ Todas as alterações salvas</span>
    <span class="totals">9 textos · 4 pastas</span>
    <span class="version">v0.21.0</span>
  </div>
  <div id="layer"></div>
</div>

<script>
  const BASIC = [["Crie um texto","Clique em **Novo** [1] › **Novo texto** [2], ou use `Ctrl+N`.",["../../src/assets/ajuda/basico-1-novo-texto.webp","Menu do botão Novo aberto, com o item Novo texto."]],["Escreva o título e o conteúdo","Escreva o título [1] e o conteúdo [2]. O CSTM salva automaticamente; a barra inferior avisa quando tudo estiver salvo.",["../../src/assets/ajuda/basico-2-titulo-conteudo.webp","Editor com o título e o conteúdo de um texto e o aviso Todas as alterações salvas."]],["Organize em pastas, se quiser","Crie pastas em **Novo** › **Nova pasta** (`Ctrl+Shift+N`) e arraste os textos [1] para dentro delas [2].",["../../src/assets/ajuda/basico-3-pastas.webp","Árvore com dois textos sendo arrastados para a pasta Clientes."]],["Abra o menu de colagem em qualquer programa","Clique onde quer colar (um e-mail, um documento, um formulário) e pressione `{atalho}`. O menu abre ao lado do cursor do mouse; para buscar, é só digitar.",["../../src/assets/ajuda/basico-4-menu-de-colagem.webp","Menu de colagem aberto junto ao mouse, com o campo Buscar no topo."]],["Escolha o texto","Clique no texto [1] para colá-lo. O botão **Copiar** [2] apenas copia o texto, para você colar depois com `Ctrl+V`.",["../../src/assets/ajuda/basico-5-escolher.webp","Menu de colagem com um texto selecionado e o botão Copiar na linha dele."]],["Pode fechar a janela","O CSTM continua rodando na bandeja, perto do relógio do Windows, e o atalho segue funcionando. Para encerrar, clique com o botão direito no ícone [1] e depois em **Sair** [2].",["../../src/assets/ajuda/basico-6-bandeja.webp","Ícone do CSTM na bandeja do Windows, com o menu aberto e o item Sair."]]];
  const ADVANCED = [["Busca",["No cadastro, **Buscar** [1] filtra a árvore por título e conteúdo, sem diferenciar acentos, e **Favoritos** [2] mostra só os textos favoritos.","No menu de colagem, basta digitar: a busca procura em todos os textos e mostra a pasta de cada resultado. Nas colunas abertas ao lado, **Buscar em** procura só naquela pasta; ao entrar numa coluna com `→`, a busca dela já fica pronta para digitar."],["../../src/assets/ajuda/avancado-busca.webp","Árvore do cadastro com o campo Buscar e o botão Favoritos."]],["Favoritos e Mais usados",["Marque um texto como favorito pela estrela no editor ou pelo menu do item na árvore.","No topo do menu de colagem ficam **Favoritos** e **Mais usados** (os 10 textos mais colados), quando têm algum texto."],["../../src/assets/ajuda/avancado-favoritos.webp","Menu de colagem com as pastas Mais usados e Favoritos no topo."]],["Textos no menu de colagem",["Títulos longos ocupam até duas linhas. Para ler o título inteiro e o conteúdo, deixe o mouse parado sobre o texto."],null],["Modos de colagem",["Escreva os textos em markdown (`**negrito**`, `_itálico_`, `- listas`, `# títulos`) e escolha como colar: **Markdown** (como está), **Sem formatação** (sem as marcas), **Formatado** (negrito, listas e links de verdade, para Word, Outlook, Gmail e Teams) ou **Google Chat** (`*negrito*`, `_itálico_`, `~tachado~`).","`Enter` e **Copiar** usam o modo padrão, escolhido em **Configurações** › **Modo de colagem padrão**. Os outros três ficam em botões na linha do texto selecionado.","No **Histórico**, `Enter` e **Copiar** colam o item como foi copiado, e os quatro modos ficam em botões. A formatação que veio junto e a sintaxe do Chat são entendidas: dá para colar no Chat um texto em markdown ou colar num e-mail, já formatada, uma mensagem copiada do Chat.","O Google Chat não tem títulos nem links com texto: os títulos viram negrito e os links aparecem como texto seguido do endereço."],["../../src/assets/ajuda/avancado-modos.webp","Linha selecionada no menu de colagem com os botões dos outros modos de colagem."]],["Menu de colagem pelo teclado",["`↑` e `↓` escolhem a linha, `Enter` cola, `Ctrl+C` copia sem colar e `Esc` fecha.","Com a busca vazia, `→` abre uma pasta e `←` volta.","Em **Configurações** › **Navegação nas pastas**, escolha se as pastas abrem ao passar o mouse (em colunas ao lado) ou ao clicar."],null],["Histórico da área de transferência",["A pasta **Histórico**, no topo do menu de colagem, guarda os últimos 100 itens copiados em qualquer programa: textos (com a formatação) e imagens. Senhas copiadas de gerenciadores de senha não são guardadas.","Clique num item para colá-lo, ou use **Copiar**. O ícone de lixeira na linha selecionada (ou `Delete`) manda o item para a **Lixeira** do cadastro.","No cadastro, o **Histórico** fica no topo da árvore: selecione um texto para editá-lo (ao gravar, a formatação que veio junto é descartada e o item sobe para o topo) ou use **Excluir** (`Delete`).","Em **Configurações**, desligue o histórico ou apague tudo com **Limpar histórico**."],["../../src/assets/ajuda/avancado-historico.webp","Pasta Histórico aberta no menu de colagem, com textos e uma imagem copiados."]],["Organizar a árvore",["Arraste textos e pastas para mudar a ordem ou a pasta; segure `Ctrl` ao soltar para copiar em vez de mover.","`Ctrl+X`, `Ctrl+C` e `Ctrl+V` recortam, copiam e colam itens, `Ctrl+Z` desfaz e `F2` renomeia. Selecione vários itens com `Ctrl` ou `Shift` + clique.","Os itens novos são criados na pasta selecionada. A pasta **Raiz** reúne o que não está em nenhuma pasta: com ela selecionada, ou sem seleção (clique no espaço vazio da árvore ou `Esc`), **Novo**, `Ctrl+V` e **Importar** usam a raiz.","O menu de uma pasta (clique direito ou **⋯**) permite criar, colar, ordenar (por nome, por mais usados ou por uso recente) e exportar o conteúdo dela; o menu da **Raiz** faz o mesmo com a raiz."],["../../src/assets/ajuda/avancado-arvore.webp","Árvore com a pasta Raiz e o menu de contexto de uma pasta aberto."]],["Lixeira",["`Delete` manda os itens selecionados para a **Lixeira** [1], no fim da árvore; `Shift+Delete` exclui definitivamente, com confirmação.","Na Lixeira, **Restaurar** devolve os itens selecionados ao lugar de onde vieram, e **Esvaziar lixeira** apaga tudo."],["../../src/assets/ajuda/avancado-lixeira.webp","Lixeira aberta, com os botões Restaurar e Esvaziar lixeira."]],["Importar e exportar",["Em **⋯** [1] › **Importar** [2]: arquivos .txt (um texto por arquivo), uma pasta do disco ou um backup JSON. Os itens entram na pasta selecionada.","Em **⋯** › **Exportar tudo**: backup JSON completo ou pastas com arquivos .txt. O menu de uma pasta exporta só ela."],["../../src/assets/ajuda/avancado-importar.webp","Menu do botão Mais opções aberto, com Importar."]],["Configurações",["Abra pela linha **Configurações** [1], no rodapé do painel, abaixo da Lixeira, ou pelo ícone da bandeja. Ali ficam o atalho do menu de colagem, navegação nas pastas, modo de colagem padrão, o que fazer depois de colar, tema, iniciar com o Windows, histórico da área de transferência e atualizações.","Em **Atualizações**, o CSTM consulta o GitHub a cada 7 dias (você pode escolher de 1 a 90) para saber se saiu uma versão nova, sem enviar nenhum dado seu. Quando sai, aparecem uma notificação do Windows e uma barra no topo do cadastro com **Abrir página da release**, onde você baixa o instalador; **Dispensar** esconde a barra até a próxima versão. **Verificar agora** consulta na hora."],["../../src/assets/ajuda/avancado-configuracoes.webp","Página Configurações aberta pela linha Configurações, no rodapé do painel."]],["Desinstalar e apagar os dados",["Desinstalar o CSTM (em **Configurações** › **Aplicativos** do Windows) sempre guarda os seus textos, para uma reinstalação encontrar tudo como estava.","Para apagar os dados antes de desinstalar, exclua os itens, esvazie a **Lixeira** e use **Limpar histórico**. Depois de desinstalar, basta apagar a pasta `%APPDATA%\\com.gabriel.cstm`."],null],["Limites do Windows",["Alguns programas, como os abertos como administrador, não aceitam a colagem do CSTM, e o Windows não avisa. O texto escolhido continua na área de transferência: se a colagem falhar, é só pressionar `Ctrl+V`, ou usar **Copiar** no menu de colagem e colar com `Ctrl+V`.","Em **Configurações** › **Depois de colar**, **Restaurar o conteúdo anterior** devolve à área de transferência, logo depois da colagem, o que estava copiado antes (texto, formatação e imagens; arquivos copiados no Explorer não voltam). Com essa opção, uma colagem que falhou não fica disponível para `Ctrl+V`."],null]];
  let theme = "claro";
  let shortcut = "Alt+Q";
  let state = "basico";
  
  const $ = (id) => document.getElementById(id);
  // Marcação do conteúdo: **negrito**, `tecla`, {atalho} e [n] (círculo da marcação n da imagem).
  function inline(text) {
    const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/{atalho}/g, shortcut);
    return safe
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`(.+?)`/g, "<kbd>$1</kbd>")
      .replace(/\[(\d)\]/g, `<span class="mark-num" aria-label="marcação $1">$1</span>`);
  }
  // As capturas têm o dobro de pixels (nitidez em telas de alta resolução): "2x" as mostra no tamanho real.
  const figure = (image) => image ? `<img class="help-img" srcset="${image[0]} 2x" alt="${image[1]}" loading="lazy" />` : "";
  function bar(states, current, extra) {
    const el = $("states");
    el.innerHTML = "";
    for (const [key, item] of Object.entries(states)) {
      const b = document.createElement("button");
      b.textContent = item.label;
      b.className = key === current ? "on" : "";
      b.onclick = () => setState(key);
      el.appendChild(b);
    }
    el.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
    for (const name of ["claro", "escuro"]) {
      const b = document.createElement("button");
      b.textContent = name === "claro" ? "Tema claro" : "Tema escuro";
      b.className = name === theme ? "on" : "";
      b.onclick = () => { theme = name; setState(current); };
      el.appendChild(b);
    }
    $("note").textContent = states[current].note + (extra ?? "");
    const cls = theme === "escuro" ? "theme-dark" : "theme-light";
    document.body.className = cls;
    $("window").className = `window ${cls}`;
  }

  const STATES = {
    basico: { label: "Básico", note: "Aba Básico, a que abre sozinha na primeira execução depois de instalar ou atualizar. Passos curtos de onde clicar." },
    avancado: { label: "Avançado", note: "As demais funcionalidades, em seções curtas. O texto cita o atalho configurado." },
    atalho: { label: "Outro atalho", note: "Com o atalho trocado nas Configurações (aqui, Ctrl+Shift+Espaço), a ajuda cita o atalho novo." },
    bandeja: { label: "Pela bandeja", note: "O item Ajuda da bandeja mostra a janela já na página. F1 também abre a Ajuda." },
    busca: { label: "Busca", note: "Buscar na Ajuda procura nas duas abas, sem diferenciar acentos; o número ao lado de cada aba diz quantas correspondências ela tem. Enter ou ↓ vai para a próxima, Shift+Enter ou ↑ para a anterior, trocando de aba quando a próxima está na outra, e a página rola até ela. Esc limpa a busca. Experimente digitar outra palavra." },
    encerrar: { label: "Bandeja: Sair", note: "Cena do passo 6 do Básico (imagem da Ajuda): o ícone do CSTM na bandeja do Windows, clicado com o botão direito, e o menu com Sair." },
    editor: { label: "Fechada (editor)", note: "Clicar de novo em Ajuda, selecionar um item na árvore ou criar um texto ou pasta volta ao editor." },
  };
  function setState(next) {
    state = next;
    shortcut = next === "atalho" ? "Ctrl+Shift+Espaço" : "Alt+Q";
    location.hash = `estado=${next}&tema=${theme}`;
    bar(STATES, next);
    $("help").classList.toggle("pressed", next !== "editor");
    const trayItems = (on) => ["Abrir cadastro", "Configurações", "Ajuda", "Sobre o CSTM"].map((t) => `<div class="${t === on ? "on" : ""}">${t}</div>`).join("") + `<hr /><div>Sair</div>`;
    $("layer").innerHTML = next === "bandeja"
      ? `<div class="tray-menu">${trayItems("Ajuda")}</div>`
      : next === "encerrar"
        ? `<div class="desktop"></div>
           <div class="taskbar">
             <span class="tray-icon">⌃</span><span class="tray-icon on" id="tray-cstm"><span class="cstm">C</span></span>
             <span class="tray-icon">📶</span><span class="tray-icon">🔊</span>
             <span class="clock">14:32<br />19/10/2026</span>
           </div>
           <div class="tray-menu above-tray">${trayItems()}</div>`
        : "";
    if (next === "editor") {
      $("editor").className = "editor";
      $("editor").textContent = "Editor do texto selecionado";
      return;
    }
    tab = next === "avancado" ? "advanced" : next === "busca" ? tab : "basic";
    query = next === "busca" ? "lixeira" : "";
    current = 0;
    $("editor").className = "editor page-host";
    $("editor").innerHTML = `
      <section class="page" aria-label="Ajuda">
        <div class="help-head">
        <div class="dialog-head"><h2>Ajuda</h2></div>
        <div class="help-search">
          <span class="search-box"><span aria-hidden="true">⌕</span><input id="help-q" placeholder="Buscar na Ajuda" aria-label="Buscar na Ajuda" /></span>
          <span class="hits" id="hits" aria-live="polite"></span>
          <button class="icon-button" id="prev" title="Anterior (Shift+Enter)" aria-label="Anterior">↑</button>
          <button class="icon-button" id="next" title="Próxima (Enter)" aria-label="Próxima">↓</button>
        </div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-basic">Básico<span class="tab-count" id="count-basic"></span></button>
          <button class="tab" role="tab" id="tab-advanced">Avançado<span class="tab-count" id="count-advanced"></span></button>
        </div>
        </div>
        <div id="panel-basic" role="tabpanel"></div>
        <div id="panel-advanced" role="tabpanel"></div>
      </section>`;
    $("help-q").value = query;
    $("help-q").oninput = (e) => { query = e.target.value; current = -1; refresh(false); };
    $("help-q").onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
      if (e.key === "Escape" && query) { e.preventDefault(); e.stopPropagation(); query = ""; e.target.value = ""; refresh(false); }
    };
    $("prev").onclick = () => step(-1);
    $("next").onclick = () => step(1);
    $("tab-basic").onclick = () => { tab = "basic"; refresh(false); };
    $("tab-advanced").onclick = () => { tab = "advanced"; refresh(false); };
    refresh(next === "busca");
  }

  // Busca na Ajuda: vale para as duas abas, sem diferenciar acentos nem maiúsculas. As
  // correspondências seguem a ordem Básico, depois Avançado; ir para uma da outra aba troca a aba.
  let tab = "basic";
  let query = "";
  let current = 0; // índice global da correspondência atual; -1 = escolher ao digitar
  let hits = [];
  const fold = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  function step(delta) {
    if (!hits.length) return;
    current = (current + delta + hits.length) % hits.length;
    refresh(true);
  }

  function refresh(scroll) {
    $("panel-basic").innerHTML = `<p class="intro">O CSTM salva textos para você reutilizar rapidamente em qualquer programa, sem precisar ficar copiando do Bloco de Notas. Para começar:</p>
      <ol class="steps">${BASIC.map(([title, text, image], i) => `<li><span class="num">${i + 1}</span><div class="step-body"><span class="step-title">${title}</span><span class="step-text">${inline(text)}</span>${figure(image)}</div></li>`).join("")}</ol>`;
    $("panel-advanced").innerHTML = ADVANCED.map(([title, items, image]) => `<div class="section"><h3>${title}</h3>${items.map((t) => `<p>${inline(t)}</p>`).join("")}${figure(image)}</div>`).join("");
    hits = [];
    const q = fold(query.trim());
    const counts = { basic: 0, advanced: 0 };
    if (q) {
      for (const key of ["basic", "advanced"]) {
        const walker = document.createTreeWalker($("panel-" + key), NodeFilter.SHOW_TEXT, {
          acceptNode: (n) => (n.parentElement.closest(".mark-num") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
        });
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
          const text = node.nodeValue;
          const folded = fold(text);
          if (folded.length !== text.length) continue;
          const found = [];
          for (let at = folded.indexOf(q); at !== -1; at = folded.indexOf(q, at + q.length)) found.push(at);
          // De trás para frente, para as posições anteriores continuarem valendo no mesmo nó.
          const marks = [];
          for (const at of found.reverse()) {
            node.splitText(at + q.length);
            const match = node.splitText(at);
            const mark = document.createElement("mark");
            mark.className = "hit";
            match.replaceWith(mark);
            mark.appendChild(match);
            marks.unshift(mark);
          }
          for (const mark of marks) hits.push({ key, mark });
          counts[key] += marks.length;
        }
      }
    }
    // Ao digitar, a primeira correspondência da aba aberta (ou a primeira de todas).
    if (current < 0) {
      const inTab = hits.findIndex((h) => h.key === tab);
      current = inTab >= 0 ? inTab : 0;
    }
    if (current >= hits.length) current = 0;
    const hit = hits[current];
    if (hit) {
      tab = hit.key;
      hit.mark.classList.add("current");
    }
    for (const key of ["basic", "advanced"]) {
      $("panel-" + key).hidden = key !== tab;
      $("tab-" + key).classList.toggle("on", key === tab);
      const c = $("count-" + key);
      c.textContent = q ? counts[key] : "";
      c.className = "tab-count" + (q ? "" : " none") + (q && !counts[key] ? " zero" : "");
    }
    $("hits").textContent = !q ? "" : hits.length ? `${current + 1} de ${hits.length}` : "Nenhum resultado";
    $("prev").disabled = $("next").disabled = hits.length === 0;
    if (scroll && hit) hit.mark.scrollIntoView({ block: "center" });
    else if (scroll === false && !q) $("editor").scrollTop = 0;
  }
  $("help").onclick = () => setState(state === "editor" ? "basico" : "editor");
  document.addEventListener("keydown", (e) => { if (e.key === "F1") { e.preventDefault(); setState("basico"); } });
  const params = new URLSearchParams(location.hash.slice(1));
  theme = params.get("tema") === "escuro" ? "escuro" : "claro";
  setState(STATES[params.get("estado")] ? params.get("estado") : "basico");
</script>
