<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>CSTM — Protótipo do menu de colagem</title>
<!--
  Protótipo estático do menu de colagem (Tela 2 de docs/telas.md).
  Não faz parte do aplicativo: abre direto no navegador, sem build.
  O menu é navegável pelo teclado e pelo mouse. Estados selecionáveis na barra superior
  ou pela URL: picker.html#estado=pasta&tema=escuro
-->
<style>
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  .theme-light {
    --layer: #f9f9f9;
    --stroke: rgba(0, 0, 0, 0.08);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --text: #1a1a1a;
    --text-2: #5d5d5d;
    --text-3: #8b8b8b;
    --hover: rgba(0, 0, 0, 0.04);
    --selected: rgba(0, 0, 0, 0.065);
    --accent: #005fb8;
    --on-accent: #ffffff;
    --danger: #c42b1c;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.14), 0 0 1px rgba(0, 0, 0, 0.2);
    --control: #ffffff;
    --control-bottom: rgba(0, 0, 0, 0.22);
    --desk: #dfe4ea;
    --app: #ffffff;
  }

  .theme-dark {
    --layer: #2c2c2c;
    --stroke: rgba(255, 255, 255, 0.07);
    --stroke-strong: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-2: #c8c8c8;
    --text-3: #9a9a9a;
    --hover: rgba(255, 255, 255, 0.05);
    --selected: rgba(255, 255, 255, 0.085);
    --accent: #60cdff;
    --on-accent: #000000;
    --danger: #ff99a4;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 1px rgba(0, 0, 0, 0.6);
    --control: #2d2d2d;
    --control-bottom: rgba(255, 255, 255, 0.2);
    --desk: #202428;
    --app: #1f1f1f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 24px 40px;
    font-family: var(--font);
    font-size: 14px;
    background: #d9dce1;
    color: #1a1a1a;
  }

  /* ---------- Painel do protótipo (fora da tela simulada) ---------- */
  .proto-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 10px;
  }
  .proto-bar button {
    font: inherit;
    font-size: 12.5px;
    padding: 4px 10px;
    border: 1px solid #b9bdc4;
    border-radius: 999px;
    background: #f4f5f7;
    cursor: pointer;
  }
  .proto-bar button.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  .proto-bar .sep { width: 1px; height: 20px; background: #b9bdc4; margin: 0 6px; }
  .proto-note {
    max-width: 900px;
    margin: 0 auto 14px;
    font-size: 13px;
    color: #374151;
    min-height: 20px;
  }

  /* ---------- Tela simulada: outro programa ao fundo ---------- */
  .desk {
    position: relative;
    width: 900px;
    height: 600px;
    margin: 0 auto;
    border-radius: 8px;
    overflow: hidden;
    background: var(--desk);
    color: var(--text);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .other-app {
    position: absolute;
    inset: 40px 60px 60px 60px;
    border-radius: 8px;
    background: var(--app);
    border: 1px solid var(--stroke-strong);
    padding: 44px 24px 24px;
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .other-app::before {
    content: "Sem título — Bloco de Notas";
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 12px;
    color: var(--text-3);
  }
  .caret { display: inline-block; width: 1px; height: 16px; background: var(--text); vertical-align: -3px; }
  .mouse {
    position: absolute;
    left: 330px;
    top: 150px;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 18px solid #111;
    transform: rotate(-30deg);
    filter: drop-shadow(0 0 1px #fff);
  }
  .toast {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 6px;
    background: #1f2937;
    color: #fff;
    font-size: 12.5px;
  }

  /* ---------- Menu ---------- */
  .picker {
    position: absolute;
    left: 338px;
    top: 166px;
    width: 420px;
    height: 440px;
    max-height: calc(100% - 176px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    border-radius: 8px;
    background: var(--layer);
    border: 1px solid var(--stroke-strong);
    box-shadow: var(--shadow);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .search { padding: 8px; border-bottom: 1px solid var(--stroke); }
  .search input {
    width: 100%;
    font: inherit;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid var(--stroke-strong);
    border-bottom: 2px solid var(--accent);
    background: var(--control);
    color: var(--text);
    outline: none;
  }
  .list { overflow-y: auto; padding: 4px; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 4px 10px;
    box-sizing: border-box;
    border-radius: 4px;
    cursor: default;
    white-space: nowrap;
  }
  .row.selected { background: var(--selected); }
  .row.selected::before {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .row .icon { width: 16px; text-align: center; color: var(--text-2); font-size: 13px; }
  /* Título em até 2 linhas antes das reticências. */
  .row .label { flex: 1; overflow: hidden; white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 18px; }
  .row .meta { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .row .chevron { color: var(--text-3); }
  /* Miniatura de uma imagem do histórico, no lugar do ícone. */
  .row .thumb {
    width: 24px; height: 20px; flex: none; border-radius: 3px;
    border: 1px solid var(--stroke-strong);
    background: linear-gradient(135deg, #7fb3e6 0 45%, #f3c26b 45% 70%, #4f8a4f 70%);
  }
  /* Botão Copiar: só na linha de texto selecionada. */
  .row .copy {
    display: none; flex: none; width: 24px; height: 24px; margin-right: -4px; place-items: center;
    border: none; border-radius: 4px; background: transparent; color: var(--text-2); font: inherit; font-size: 14px; cursor: pointer;
  }
  .row.selected .copy { display: grid; }
  .row .copy:hover { background: rgba(127, 127, 127, 0.18); color: var(--text); }
  .row.back { color: var(--text-2); }
  .row.back .label { font-weight: 600; color: var(--text); }
  .empty { padding: 28px 16px; text-align: center; color: var(--text-2); }
  .empty button {
    margin-top: 12px;
    font: inherit;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--on-accent);
  }
  .error { padding: 16px; color: var(--danger); }
  .hints {
    display: flex;
    gap: 14px;
    padding: 7px 12px;
    border-top: 1px solid var(--stroke);
    font-size: 12px;
    color: var(--text-3);
  }
  .hints .end { margin-left: auto; }

  /* ---------- Modo cascata (navegação ao passar o mouse) ---------- */
  .proto-label { font-size: 12.5px; color: #374151; margin-right: 2px; }
  .proto-bar label { font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
  .workarea {
    position: absolute;
    left: 0; top: 0; width: 900px; height: 560px;
    border: 2px dashed rgba(220, 60, 60, 0.7);
    pointer-events: none;
  }
  .workarea span {
    position: absolute; right: 6px; top: 4px;
    font-size: 11px; color: rgba(200, 50, 50, 0.95);
  }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    display: grid; place-items: center;
    background: var(--layer); border-top: 1px solid var(--stroke-strong);
    font-size: 11px; color: var(--text-3);
  }
  /* Retângulo da janela do picker: transparente no aplicativo; aqui só o contorno. */
  .cwin {
    position: absolute;
    border: 1px dashed rgba(40, 110, 220, 0.8);
    pointer-events: none;
    z-index: 5;
  }
  .cwin span { position: absolute; left: 4px; bottom: -16px; font-size: 11px; color: rgba(40, 110, 220, 0.95); white-space: nowrap; }
  .card {
    position: absolute;
    z-index: 4;
    display: flex;
    flex-direction: column;
    border-radius: 8px;
    background: var(--layer);
    border: 1px solid var(--stroke-strong);
    box-shadow: var(--shadow);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .card .list { flex: 1; min-height: 0; }
  .subsearch { position: relative; padding: 6px; border-bottom: 1px solid var(--stroke); }
  .subsearch input { padding: 4px 26px 4px 8px; font-size: 13px; }
  .subsearch .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; color: var(--text-2, #6b7280); cursor: pointer; font-size: 12px; padding: 2px 4px;
  }
  .row.open { background: var(--selected); }
  .cstatus { max-width: 900px; margin: 8px auto 0; font-size: 13px; color: #374151; min-height: 20px; }
  kbd {
    font: inherit;
    font-size: 11px;
    padding: 0 4px;
    border-radius: 3px;
    border: 1px solid var(--stroke-strong);
    color: var(--text-2);
  }
</style>
</head>
<body>

<div class="proto-bar" id="navbar"></div>
<div class="proto-bar" id="cstates"></div>
<div class="proto-note" id="cnote"></div>
<div class="proto-bar" id="states"></div>
<div class="proto-note" id="note"></div>

<div class="desk" id="cdesk">
  <div class="other-app" id="cother">Prezado cliente,<br /><br /><span class="caret"></span></div>
  <div class="mouse" id="cmouse"></div>
  <div class="workarea"><span>Área útil do monitor</span></div>
  <div class="taskbar">Barra de tarefas</div>
  <div class="cwin" id="cwin"><span>Janela do picker (transparente)</span></div>
</div>
<div class="cstatus" id="cstatus"></div>

<div class="desk" id="desk">
  <div class="other-app" id="other">Prezado cliente,<br /><br /><span class="caret"></span></div>
  <div class="mouse"></div>
  <div class="picker" id="picker" role="dialog" aria-label="Menu de colagem">
    <div class="search"><input id="search" placeholder="Buscar" aria-label="Buscar" autocomplete="off" /></div>
    <div class="list" id="list" role="listbox" aria-label="Textos"></div>
    <div class="hints" id="hints"></div>
  </div>
</div>

<script>
  // Botões dos modos de colagem que não são o padrão (Markdown), só em textos cadastrados (plano 082).
  const MODE_BUTTONS = `<button class="copy mode" title="Colar sem formatação" aria-label="Colar sem formatação" tabindex="-1">Aa</button><button class="copy mode" title="Colar formatado" aria-label="Colar formatado" tabindex="-1"><b>B</b></button><button class="copy mode" title="Colar para o Google Chat" aria-label="Colar para o Google Chat" tabindex="-1">G</button>`;
  // No Histórico, Enter e Copiar colam o original; os quatro modos ficam em botões, só nos textos (plano 083).
  // Só nos itens do Histórico: move o item para a Lixeira do cadastro, sem fechar o menu.
  const DELETE_BUTTON = `<button class="copy" title="Excluir (Delete)" aria-label="Excluir" tabindex="-1"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg></button>`;
  const HISTORY_MODE_BUTTONS = `<button class="copy mode" title="Colar como markdown" aria-label="Colar como markdown" tabindex="-1">M</button>` + MODE_BUTTONS;

  // Biblioteca de exemplo, a mesma do protótipo do cadastro.
  const folders = [
    { id: 1, parent: null, name: "Trabalho" },
    { id: 2, parent: 1, name: "E-mails" },
    { id: 3, parent: 2, name: "Clientes" },
    { id: 4, parent: null, name: "Pessoal" },
  ];
  const snippets = [
    { id: 1, folder: 2, title: "Resposta padrão", content: "Olá! Obrigado pelo contato. Recebemos sua mensagem e retornaremos em até 24 horas.", favorite: false, uses: 12 },
    { id: 2, folder: 2, title: "Follow-up", content: "Olá, tudo bem? Gostaria de saber se teve a chance de ver a proposta.", favorite: false, uses: 3 },
    { id: 3, folder: 1, title: "Saudação formal", content: "Prezado(a), espero que esteja bem.", favorite: true, uses: 0 },
    { id: 4, folder: 1, title: "Assinatura", content: "Atenciosamente,\nGabriel", favorite: true, uses: 27 },
    { id: 5, folder: 4, title: "Respostas rápidas", content: "Pode deixar, já vejo isso.", favorite: false, uses: 1 },
    { id: 6, folder: null, title: "Telefone", content: "(11) 91234-5678", favorite: true, uses: 8 },
    { id: 7, folder: null, title: "Link da agenda", content: "https://agenda.exemplo.com/gabriel", favorite: false, uses: 0 },
  ];

  // Pastas virtuais da raiz, calculadas a cada abertura; não existem no cadastro.
  const MOST_USED_LIMIT = 10;
  const VIRTUAL = {
    "mais-usados": {
      name: "Mais usados", icon: "🔥",
      items: () => snippets.filter((s) => s.uses > 0).sort((a, b) => b.uses - a.uses).slice(0, MOST_USED_LIMIT),
    },
    favoritos: {
      name: "Favoritos", icon: "⭐",
      items: () => snippets.filter((s) => s.favorite).sort((a, b) => a.title.localeCompare(b.title)),
    },
  };
  // Histórico do clipboard: itens copiados em qualquer programa, do mais recente para o mais
  // antigo. O título de um texto é a primeira linha não vazia; uma imagem mostra a miniatura.
  const history = [
    { id: "h1", title: "Reunião confirmada para quinta às 15h, sala 2.", content: "Reunião confirmada para quinta às 15h, sala 2.
Levar o relatório impresso.", when: "14:32" },
    { id: "h2", title: "Imagem 1920 × 1080", content: "Imagem 1920 × 1080", image: true, when: "14:10" },
    { id: "h3", title: "Proposta comercial — resumo", content: "Proposta comercial — resumo
(com formatação do Word: negrito, listas e tabela)", when: "11:05" },
    { id: "h4", title: "https://github.com/marinsgabriel1997/CSTM", content: "https://github.com/marinsgabriel1997/CSTM", when: "ontem" },
  ];
  // Com a opção desligada nas Configurações, a pasta some do menu.
  const historyOn = () => mode !== "sem-historico";
  VIRTUAL.historico = { name: "Histórico", icon: "🕘", items: () => (historyOn() ? history : []) };
  // O Histórico vem antes de Mais usados e Favoritos.
  const VIRTUAL_ORDER = ["historico", "mais-usados", "favoritos"];
  const isVirtual = (id) => typeof id === "string";

  const STATES = {
    raiz: { label: "Raiz", note: "Estado ao abrir: as pastas Histórico, Mais usados e Favoritos no topo, depois o conteúdo da raiz, com a busca focada. Cada uma some quando está vazia; o Histórico também some com a opção desligada nas Configurações." },
    historico: { label: "Histórico", note: "Os itens copiados em qualquer programa, do mais recente para o mais antigo, com a hora da cópia à direita (ou a data, se não foi hoje). Texto: a primeira linha; imagem: miniatura e tamanho. Enter ou clique cola (com a formatação, se havia; a imagem como imagem); Copiar ou Ctrl+C deixa no clipboard. O item usado sobe para o topo. A lixeira (ou Delete) move o item selecionado para a Lixeira do cadastro, sem fechar o menu. A busca não inclui o histórico." },
    "mais-usados": { label: "Mais usados", note: "Os 10 textos mais colados, do mais usado para o menos usado; a pasta de cada um aparece à direita, como na busca." },
    favoritos: { label: "Favoritos", note: "Os textos favoritos, por título, com a pasta de cada um à direita." },
    "sem-historico": { label: "Histórico desligado", note: "Com \"Guardar o histórico do clipboard\" desligado nas Configurações (ou sem nenhum item guardado), a pasta Histórico não aparece." },
    pasta: { label: "Dentro de uma pasta", note: "← ou Backspace (com a busca vazia) volta; clicar na linha de volta também." },
    busca: { label: "Busca", note: "A busca vale para toda a biblioteca; a pasta de cada resultado aparece à direita." },
    "sem-resultados": { label: "Busca sem resultados", note: "" },
    vazio: { label: "Biblioteca vazia", note: "O botão abre a janela de cadastro." },
    erro: { label: "Falha ao carregar", note: "A mensagem vem do backend." },
  };

  let theme = "claro";
  let mode = "raiz";
  let folder = null;
  let query = "";
  let selected = 0;
  let rows = [];
  let open = true;
  let nav = "cascata"; // "cascata" = Abrir ao passar o mouse; "clique" = Clicar para abrir
  let scenario = "normal";
  const syncHash = () => { location.hash = `nav=${nav}&estado=${mode}&cenario=${scenario}&tema=${theme}`; };

  const $ = (id) => document.getElementById(id);
  const fold = (text) => text.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
  const nameOf = (id) => folders.find((f) => f.id === id).name;

  function pathOf(id) {
    if (isVirtual(id)) return VIRTUAL[id].name;
    const names = [];
    for (let at = id; at !== null; at = folders.find((f) => f.id === at).parent) names.unshift(nameOf(at));
    return names.join(" › ");
  }

  // Aproxima a busca do backend: todos os termos, por prefixo de palavra, sem acentos.
  function search(text) {
    const terms = fold(text).split(/\s+/).filter(Boolean);
    return snippets.filter((s) => {
      const words = fold(`${s.title} ${s.content}`).split(/[^\p{L}\p{N}]+/u);
      return terms.every((term) => words.some((word) => word.startsWith(term)));
    });
  }

  function buildRows() {
    if (mode === "vazio" || mode === "erro") return [];
    if (query.trim()) {
      return search(query).map((s) => ({ kind: "snippet", item: s, meta: s.folder && nameOf(s.folder), tip: s.folder ? pathOf(s.folder) : "" }));
    }
    const result = [];
    if (folder === "historico") {
      result.push({ kind: "back", label: pathOf(folder) });
      result.push(...history.map((h) => ({ kind: "snippet", item: h, meta: h.when, tip: "", thumb: h.image })));
      return result;
    }
    if (isVirtual(folder)) {
      result.push({ kind: "back", label: pathOf(folder) });
      result.push(...VIRTUAL[folder].items().map((s) => ({ kind: "snippet", item: s, meta: s.folder && nameOf(s.folder), tip: s.folder ? pathOf(s.folder) : "" })));
      return result;
    }
    const contents = [
      ...folders.filter((f) => f.parent === folder).map((f) => ({ kind: "folder", item: f })),
      ...snippets.filter((s) => s.folder === folder).map((s) => ({ kind: "snippet", item: s })),
    ];
    if (folder === null) {
      for (const id of VIRTUAL_ORDER) {
        const virtual = VIRTUAL[id];
        if (virtual.items().length) result.push({ kind: "folder", item: { id, name: virtual.name }, icon: virtual.icon });
      }
      result.push(...contents);
    } else {
      result.push({ kind: "back", label: pathOf(folder) });
      result.push(...contents);
    }
    return result;
  }

  const selectable = (row) => row.kind === "snippet" || row.kind === "folder";

  function render() {
    document.body.className = theme === "escuro" ? "theme-dark" : "theme-light";
    $("desk").className = `desk ${theme === "escuro" ? "theme-dark" : "theme-light"}`;
    $("picker").style.display = open ? "" : "none";
    renderBar();
    rows = buildRows();
    const indexes = rows.map((row, index) => (selectable(row) ? index : -1)).filter((i) => i >= 0);
    if (!indexes.includes(selected)) selected = indexes[0] ?? -1;

    const list = $("list");
    list.innerHTML = "";
    if (mode === "erro") {
      list.innerHTML = `<div class="error">Não foi possível carregar os textos: banco de dados indisponível.</div>`;
    } else if (mode === "vazio") {
      list.innerHTML = `<div class="empty">Nenhum texto cadastrado.<br /><button>Abrir cadastro</button></div>`;
    } else if (query.trim() && rows.length === 0) {
      list.innerHTML = `<div class="empty">Nenhum texto encontrado.</div>`;
    } else {
      rows.forEach((row, index) => list.appendChild(renderRow(row, index)));
      if (folder !== null && rows.length === 1) {
        list.insertAdjacentHTML("beforeend", `<div class="empty">Pasta vazia.</div>`);
      }
    }
    list.querySelector(".selected")?.scrollIntoView({ block: "nearest" });

    const hints = [];
    if (rows.length) hints.push(`<span><kbd>Enter</kbd> colar</span>`);
    if (rows.length && !query.trim()) hints.push(folder === null ? `<span><kbd>→</kbd> abrir pasta</span>` : `<span><kbd>←</kbd> voltar</span>`);
    hints.push(`<span class="end"><kbd>Esc</kbd> fechar</span>`);
    $("hints").innerHTML = hints.join("");
  }

  function renderRow(row, index) {
    const el = document.createElement("div");
    el.className = `row ${row.kind}${index === selected ? " selected" : ""}`;
    if (row.kind === "back") {
      el.innerHTML = `<span class="icon">‹</span><span class="label"></span>`;
      el.querySelector(".label").textContent = row.label;
      el.onclick = goBack;
      return el;
    }
    el.setAttribute("role", "option");
    el.setAttribute("aria-selected", index === selected);
    const isFolder = row.kind === "folder";
    el.innerHTML = (row.thumb ? `<span class="thumb"></span>` : `<span class="icon">${row.icon ?? (isFolder ? "📁" : "📄")}</span>`) + `<span class="label"></span>` +
      (row.meta ? `<span class="meta"></span>` : "") + (isFolder ? `<span class="chevron">›</span>` : (row.item.when ? (row.thumb ? "" : HISTORY_MODE_BUTTONS) : MODE_BUTTONS) + `<button class="copy" title="Copiar (Ctrl+C)" aria-label="Copiar" tabindex="-1">⧉</button>` + (row.item.when ? DELETE_BUTTON : ""));
    el.querySelector(".label").textContent = isFolder ? row.item.name : row.item.title;
    if (row.meta) el.querySelector(".meta").textContent = row.meta;
    el.title = isFolder ? "" : row.item.when ? row.item.content : [row.item.title, row.tip, row.item.content].filter(Boolean).join("\n\n");
    el.onmousemove = () => {
      if (selected !== index) { selected = index; render(); }
    };
    el.onclick = () => choose(row);
    el.querySelector(".copy")?.addEventListener("click", (event) => { event.stopPropagation(); copy(row.item); });
    return el;
  }

  function choose(row) {
    if (row.kind === "folder") {
      folder = row.item.id;
      selected = 0;
      render();
      return;
    }
    close(`Copiado para o clipboard: “${row.item.title}”. No p60, o texto é colado no Bloco de Notas.`);
  }

  function copy(snippet) {
    close(`Copiado para o clipboard, sem colar: “${snippet.title}”. O foco volta ao programa anterior.`);
  }

  function goBack() {
    if (folder === null) return;
    const from = folder;
    folder = isVirtual(folder) ? null : folders.find((f) => f.id === folder).parent;
    rows = buildRows();
    selected = rows.findIndex((row) => row.kind === "folder" && row.item.id === from);
    render();
  }

  function move(step) {
    const indexes = rows.map((row, index) => (selectable(row) ? index : -1)).filter((i) => i >= 0);
    if (!indexes.length) return;
    const at = indexes.indexOf(selected);
    if (step === "first") selected = indexes[0];
    else if (step === "last") selected = indexes[indexes.length - 1];
    else selected = indexes[Math.min(indexes.length - 1, Math.max(0, at + step))];
    render();
  }

  function close(message) {
    open = false;
    render();
    showToast(message ?? "Menu fechado sem colar. Pressione Alt+Q para abrir de novo.");
  }

  function reopen() {
    open = true;
    folder = null;
    query = "";
    $("search").value = "";
    selected = 0;
    hideToast();
    render();
    $("search").focus();
  }

  function showToast(message) {
    hideToast();
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.id = "toast";
    toast.textContent = message;
    $("desk").appendChild(toast);
  }
  function hideToast() { $("toast")?.remove(); }

  $("search").addEventListener("input", (event) => {
    query = event.target.value;
    selected = 0;
    render();
  });

  $("search").addEventListener("keydown", (event) => {
    const empty = !query;
    const row = rows[selected];
    switch (event.key) {
      case "ArrowDown": move(1); break;
      case "ArrowUp": move(-1); break;
      case "Home": if (!empty) return; move("first"); break;
      case "End": if (!empty) return; move("last"); break;
      case "Enter": if (row) choose(row); break;
      case "ArrowRight": if (!empty) return; if (row?.kind === "folder") choose(row); break;
      case "ArrowLeft":
      case "Backspace": if (!empty) return; goBack(); break;
      case "Escape": close(); break;
      case "c":
      case "C":
        // Com um trecho da busca selecionado, Ctrl+C copia o trecho.
        if (!event.ctrlKey || row?.kind !== "snippet" || event.target.selectionStart !== event.target.selectionEnd) return;
        copy(row.item);
        break;
      default: return;
    }
    event.preventDefault();
  });

  document.addEventListener("keydown", (event) => {
    if (nav === "clique" && event.altKey && event.key.toLowerCase() === "q") {
      event.preventDefault();
      open ? close() : reopen();
    }
  });

  // Clique fora do menu fecha sem colar.
  $("desk").addEventListener("mousedown", (event) => {
    if (open && !$("picker").contains(event.target)) close();
  });

  function setState(state) {
    mode = state;
    open = true;
    folder = state === "pasta" ? 2 : state === "mais-usados" || state === "favoritos" || state === "historico" ? state : null;
    query = state === "busca" ? "resp" : state === "sem-resultados" ? "orçamento" : "";
    $("search").value = query;
    selected = 0;
    hideToast();
    syncHash();
    render();
    $("search").focus();
  }

  function renderBar() {
    const bar = $("states");
    bar.innerHTML = "";
    for (const [key, state] of Object.entries(STATES)) {
      const button = document.createElement("button");
      button.textContent = state.label;
      button.className = key === mode ? "on" : "";
      button.onclick = () => setState(key);
      bar.appendChild(button);
    }
    bar.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
    for (const name of ["claro", "escuro"]) {
      const button = document.createElement("button");
      button.textContent = name === "claro" ? "Tema claro" : "Tema escuro";
      button.className = name === theme ? "on" : "";
      button.onclick = () => {
        theme = name;
        syncHash();
        render();
        $("search").focus();
      };
      bar.appendChild(button);
    }
    $("note").textContent = `${STATES[mode].note} Experimente: setas, Enter, →/←, digitar, Esc, Alt+Q e clique fora do menu.`;
  }

  const params = new URLSearchParams(location.hash.slice(1));
  theme = params.get("tema") === "escuro" ? "escuro" : "claro";
  setState(STATES[params.get("estado")] ? params.get("estado") : "raiz");
</script>

<script>
  // ===== Modo cascata: o conteúdo de uma pasta abre numa coluna ao lado =====
  // A área útil simulada é 900 x 560 (a barra de tarefas ocupa o resto da tela de 900 x 600).
  // As colunas são cartões com sombra própria dentro de uma janela transparente; clicar fora
  // dos cartões fecha o menu. A geometria (placeColumn) é a regra de telas.md.
  (() => {
    const AREA = { w: 900, h: 560 };
    const GAP = 2, MAIN_W = 420, MAIN_H = 440, SUB_W = 380, ROW_H = 32;
    // Altura do campo de busca no topo de cada subcoluna (margem, campo e linha divisória).
    const SUB_SEARCH_H = 41;

    const SCEN = {
      normal: { label: "Normal", x: 250, y: 30, note: "Passe o mouse sobre Trabalho: a coluna abre na hora à direita, alinhada à pasta e com a altura do conteúdo. Continue em E-mails e Clientes." },
      direita: { label: "Borda direita", x: 556, y: 30, note: "O menu abriu junto à borda direita. Passe o mouse sobre Trabalho: sem espaço à direita, a coluna abre à esquerda. Em E-mails já não há espaço dos dois lados e as colunas mais antigas saem de vista." },
      inferior: { label: "Borda inferior", x: 250, y: 120, note: "O menu abriu junto à borda inferior da área útil. Passe o mouse sobre Modelos (12 textos): a coluna sobe o necessário para caber, ficando acima da pasta." },
      grande: { label: "Coluna grande", x: 250, y: 120, note: "Passe o mouse sobre Arquivo (30 textos): a coluna é maior que a área útil, ocupa toda a altura dela e rola; ↑/↓ rolam até o item selecionado." },
    };

    // Biblioteca da demonstração: a do protótipo mais duas pastas longas.
    const cFolders = [...folders, { id: 5, parent: null, name: "Modelos" }, { id: 6, parent: null, name: "Arquivo" }];
    const cSnippets = [
      ...snippets,
      ...Array.from({ length: 12 }, (_, i) => ({ id: 100 + i, folder: 5, title: `Modelo ${i + 1}`, content: `Texto do modelo ${i + 1}.`, favorite: false, uses: 0 })),
      ...Array.from({ length: 30 }, (_, i) => ({ id: 200 + i, folder: 6, title: `Documento ${i + 1}`, content: `Texto do documento ${i + 1}.`, favorite: false, uses: 0 })),
    ];
    const VIRT = {
      historico: { name: "Histórico", icon: "🕘", history: true, items: () => (historyOn() ? history : []) },
      "mais-usados": { name: "Mais usados", icon: "🔥", items: () => cSnippets.filter((s) => s.uses > 0).sort((a, b) => b.uses - a.uses).slice(0, 10) },
      favoritos: { name: "Favoritos", icon: "⭐", items: () => cSnippets.filter((s) => s.favorite).sort((a, b) => a.title.localeCompare(b.title)) },
    };
    const cName = (id) => cFolders.find((f) => f.id === id).name;
    const cPath = (id) => {
      const names = [];
      for (let at = id; at !== null; at = cFolders.find((f) => f.id === at).parent) names.unshift(cName(at));
      return names.join(" › ");
    };
    const snip = (s, withMeta) => ({ kind: "snippet", key: s.id, title: s.title, content: s.content, meta: withMeta && s.folder ? cName(s.folder) : "", tip: s.folder ? cPath(s.folder) : "" });
    const fold1 = (id, name, icon) => ({ kind: "folder", key: id, title: name, icon });

    function entriesOf(key) {
      if (key === null) {
        return [
          ...Object.entries(VIRT).filter(([, v]) => v.items().length).map(([id, v]) => fold1(id, v.name, v.icon)),
          ...cFolders.filter((f) => f.parent === null).map((f) => fold1(f.id, f.name)),
          ...cSnippets.filter((s) => s.folder === null).map((s) => snip(s)),
        ];
      }
      if (key === "historico") return history.map((h) => ({ kind: "snippet", key: h.id, title: h.title, content: h.content, meta: h.when, tip: "", thumb: h.image }));
      if (typeof key === "string") return VIRT[key].items().map((s) => snip(s, true));
      return [
        ...cFolders.filter((f) => f.parent === key).map((f) => fold1(f.id, f.name)),
        ...cSnippets.filter((s) => s.folder === key).map((s) => snip(s)),
      ];
    }
    function searchEntries(text) {
      const terms = fold(text).split(/\s+/).filter(Boolean);
      return cSnippets
        .filter((s) => {
          const words = fold(`${s.title} ${s.content}`).split(/[^\p{L}\p{N}]+/u);
          return terms.every((term) => words.some((word) => word.startsWith(term)));
        })
        .map((s) => snip(s, true));
    }

    const matchesAll = (text, terms) => {
      const words = fold(text).split(/[^\p{L}\p{N}]+/u);
      return terms.every((term) => words.some((word) => word.startsWith(term)));
    };
    const inside = (folder, key) => {
      for (let at = folder; at !== null; at = cFolders.find((f) => f.id === at).parent) if (at === key) return true;
      return false;
    };
    // Resultado do campo de uma subcoluna: só a partir da pasta dela.
    function filterEntries(key, text) {
      const terms = fold(text).split(/\s+/).filter(Boolean);
      if (key === "historico") {
        return entriesOf(key).filter((h) => matchesAll(`${h.title} ${h.content}`, terms));
      }
      if (typeof key === "string") {
        const ids = new Set(VIRT[key].items().map((s) => s.id));
        return searchEntries(text).filter((e) => ids.has(e.key));
      }
      return cSnippets
        .filter((s) => s.folder !== null && inside(s.folder, key) && matchesAll(`${s.title} ${s.content}`, terms))
        .map((s) => ({ ...snip(s), meta: s.folder !== key ? cName(s.folder) : "" }));
    }

    // Geometria da coluna nova (o backend faz o mesmo no aplicativo). Coordenadas na área útil:
    // toda subcoluna começa no topo da coluna principal e desce até a borda de baixo.
    function placeColumn(parent, contentH, earlier) {
      const y = cols[0].y;
      const h = Math.min(contentH, AREA.h - y);
      const hits = (x) => earlier.some((c) => !c.hidden && x < c.x + c.w && x + SUB_W > c.x);
      let x = parent.x + parent.w + GAP;
      let side = "direita";
      if (x + SUB_W > AREA.w || hits(x)) {
        x = parent.x - SUB_W - GAP;
        side = "esquerda";
        if (x < 0 || hits(x)) { x = AREA.w - SUB_W; side = "sem espaço"; }
      }
      return { x, y, h, side, full: h === AREA.h - y };
    }

    const desk = $("cdesk");
    let cols = [];
    let active = 0;
    let isOpen = true;
    let query = "";
    let showWin = true;

    const rectOf = (el) => { const r = el.getBoundingClientRect(), d = desk.getBoundingClientRect(); return { top: r.top - d.top, left: r.left - d.left }; };

    function fillList(col, items) {
      col.items = items;
      col.rows = [];
      col.list.innerHTML = "";
      items.forEach((entry, ri) => {
        const el = document.createElement("div");
        el.className = "row";
        el.setAttribute("role", "option");
        const isFolder = entry.kind === "folder";
        el.innerHTML = (entry.thumb ? `<span class="thumb"></span>` : `<span class="icon">${entry.icon ?? (isFolder ? "📁" : "📄")}</span>`) + `<span class="label"></span>` +
          (entry.meta ? `<span class="meta"></span>` : "") + (isFolder ? `<span class="chevron">›</span>` : ("thumb" in entry ? (entry.thumb ? "" : HISTORY_MODE_BUTTONS) : MODE_BUTTONS) + `<button class="copy" title="Copiar (Ctrl+C)" aria-label="Copiar" tabindex="-1">⧉</button>` + ("thumb" in entry ? DELETE_BUTTON : ""));
        el.querySelector(".label").textContent = entry.title;
        if (entry.meta) el.querySelector(".meta").textContent = entry.meta;
        if (!isFolder) el.title = "thumb" in entry ? entry.content : [entry.title, entry.tip, entry.content].filter(Boolean).join("\n\n");
        el.addEventListener("mousemove", (e) => {
          if (e.movementX === 0 && e.movementY === 0) return;
          hoverRow(cols.indexOf(col), ri);
        });
        el.addEventListener("click", () => clickRow(cols.indexOf(col), ri));
        el.querySelector(".copy")?.addEventListener("click", (event) => { event.stopPropagation(); copyEntry(entry); });
        col.list.appendChild(el);
        col.rows.push({ el, entry });
      });
      const filtered = col.key === null ? query : col.query;
      if (!items.length) col.list.innerHTML = `<div class="empty">${filtered ? "Nenhum texto encontrado." : "Pasta vazia."}</div>`;
    }

    function markRows() {
      cols.forEach((col, ci) => col.rows.forEach((row, ri) => {
        row.el.classList.toggle("selected", ci === active && ri === col.sel);
        row.el.classList.toggle("open", ci !== active || ri !== col.sel ? ri === col.openRow : false);
        row.el.setAttribute("aria-selected", ci === active && ri === col.sel);
      }));
      cols[active]?.rows[cols[active].sel]?.el.scrollIntoView({ block: "nearest" });
      const row = cols[active]?.rows[cols[active].sel];
      const parts = [];
      if (row) parts.push(`<span><kbd>Enter</kbd> ${row.entry.kind === "folder" ? "abrir" : "colar"}</span>`);
      const typed = active === 0 ? query : cols[active]?.query;
      if (!typed && row?.entry.kind === "folder") parts.push(`<span><kbd>→</kbd> abrir</span>`);
      if (!typed && active > 0) parts.push(`<span><kbd>←</kbd> voltar</span>`);
      parts.push(`<span class="end"><kbd>Esc</kbd> fechar</span>`);
      $("chints").innerHTML = parts.join("");
    }

    function updateWindow() {
      const vis = cols.filter((c) => !c.hidden);
      const box = $("cwin");
      box.style.display = isOpen && showWin && vis.length ? "" : "none";
      if (!vis.length) return;
      const x1 = Math.min(...vis.map((c) => c.x)), y1 = Math.min(...vis.map((c) => c.y));
      const x2 = Math.max(...vis.map((c) => c.x + c.w)), y2 = Math.max(...vis.map((c) => c.y + c.h));
      Object.assign(box.style, { left: `${x1 - 1}px`, top: `${y1 - 1}px`, width: `${x2 - x1 + 2}px`, height: `${y2 - y1 + 2}px` });
    }

    function setStatus(text) { $("cstatus").textContent = text; }

    function closeFrom(n) {
      while (cols.length > n) cols.pop().el.remove();
      for (const c of cols) {
        if (c.hiddenBy !== undefined && c.hiddenBy >= n) { c.hidden = false; c.el.style.display = ""; delete c.hiddenBy; }
      }
      if (n >= 1 && cols[n - 1]) cols[n - 1].openRow = -1;
      if (active >= n) active = n - 1;
      updateWindow();
    }

    function openColumn(ci, ri) {
      const parent = cols[ci];
      const entry = parent.rows[ri].entry;
      closeFrom(ci + 1);
      const items = entriesOf(entry.key);
      const contentH = SUB_SEARCH_H + (items.length ? items.length * ROW_H + 10 : 56);
      const g = placeColumn(parent, contentH, cols);

      const el = document.createElement("div");
      el.className = "card";
      el.setAttribute("aria-label", entry.title);
      el.innerHTML = `<div class="search subsearch"><input autocomplete="off" /><button class="clear" title="Limpar" aria-label="Limpar" tabindex="-1" hidden>✕</button></div><div class="list" role="listbox"></div>`;
      Object.assign(el.style, { left: `${g.x}px`, top: `${g.y}px`, width: `${SUB_W}px`, height: `${g.h}px` });
      const input = el.querySelector("input");
      const clear = el.querySelector(".clear");
      input.placeholder = `Buscar em ${entry.title}`;
      input.setAttribute("aria-label", `Buscar em ${entry.title}`);
      el.children[1].style.overflowY = "auto";
      desk.appendChild(el);
      const col = { el, list: el.children[1], input, key: entry.key, x: g.x, y: g.y, w: SUB_W, h: g.h, sel: -1, openRow: -1, query: "" };
      cols.push(col);
      fillList(col, items);
      parent.openRow = ri;

      const applyFilter = () => {
        const ci = cols.indexOf(col);
        col.query = input.value;
        clear.hidden = !input.value;
        closeFrom(ci + 1);
        fillList(col, input.value.trim() ? filterEntries(col.key, input.value) : entriesOf(col.key));
        col.sel = col.rows.length ? 0 : -1;
        active = ci;
        markRows();
      };
      input.addEventListener("input", applyFilter);
      input.addEventListener("focus", () => {
        const ci = cols.indexOf(col);
        if (active !== ci) { active = ci; if (col.sel < 0 && col.rows.length) col.sel = 0; markRows(); }
      });
      clear.addEventListener("mousedown", (event) => event.preventDefault());
      clear.addEventListener("click", () => { input.value = ""; applyFilter(); input.focus(); });

      // Colunas mais antigas cobertas pela nova saem de vista.
      if (g.side === "sem espaço") {
        cols.slice(0, ci).forEach((c) => {
          const ow = Math.max(0, Math.min(c.x + c.w, g.x + SUB_W) - Math.max(c.x, g.x));
          const oh = Math.max(0, Math.min(c.y + c.h, g.y + g.h) - Math.max(c.y, g.y));
          if (!c.hidden && ow * oh > 0) {
            c.hidden = true; c.hiddenBy = ci + 1; c.el.style.display = "none";
          }
        });
      }
      updateWindow();
      markRows();
      const bits = [`“${entry.title}”: abriu à ${g.side === "sem espaço" ? "direita, sem espaço dos dois lados (colunas mais antigas saem de vista)" : g.side}`];
      if (g.full) bits.push("topo no da coluna principal; não cabe até a borda de baixo, então rola");
      else bits.push("topo no da coluna principal, altura pelo conteúdo");
      setStatus(bits.join("; ") + ".");
    }

    function hoverRow(ci, ri) {
      const col = cols[ci];
      if (!col) return;
      const entry = col.rows[ri].entry;
      if (!(active === ci && col.sel === ri)) { active = ci; col.sel = ri; markRows(); }
      if (ci === 0 && query) return; // resultados da busca: lista única
      if (entry.kind !== "folder") { closeFrom(ci + 1); markRows(); return; }
      if (cols[ci + 1] && cols[ci + 1].key === entry.key) return;
      openColumn(ci, ri);
    }

    function clickRow(ci, ri) {
      const entry = cols[ci].rows[ri].entry;
      active = ci; cols[ci].sel = ri;
      if (entry.kind === "folder") {
        if (!(cols[ci + 1] && cols[ci + 1].key === entry.key)) openColumn(ci, ri);
        markRows();
      } else {
        paste(entry);
      }
    }

    function paste(entry) {
      closeMenu(`Colado no Bloco de Notas: “${entry.title}”.`);
    }

    function copyEntry(entry) {
      closeMenu(`Copiado para o clipboard, sem colar: “${entry.title}”. O foco volta ao programa anterior.`);
    }

    function buildMain() {
      const sc = SCEN[scenario];
      const el = document.createElement("div");
      el.className = "card";
      el.setAttribute("role", "dialog");
      el.setAttribute("aria-label", "Menu de colagem");
      el.style.display = "grid";
      el.style.gridTemplateRows = "auto 1fr auto";
      Object.assign(el.style, { left: `${sc.x}px`, top: `${sc.y}px`, width: `${MAIN_W}px`, height: `${MAIN_H}px` });
      el.innerHTML = `<div class="search"><input id="csearch" placeholder="Buscar" aria-label="Buscar" autocomplete="off" /></div><div class="list" role="listbox" style="overflow-y:auto"></div><div class="hints" id="chints"></div>`;
      desk.appendChild(el);
      const col = { el, list: el.children[1], key: null, x: sc.x, y: sc.y, w: MAIN_W, h: MAIN_H, sel: 0, openRow: -1 };
      cols = [col];
      active = 0;
      fillList(col, entriesOf(null));
      $("csearch").addEventListener("input", (e) => {
        query = e.target.value;
        closeFrom(1);
        fillList(col, query.trim() ? searchEntries(query) : entriesOf(null));
        col.sel = col.rows.length ? 0 : -1;
        active = 0;
        markRows();
        updateWindow();
      });
      $("csearch").focus();
      markRows();
      updateWindow();
    }

    function openMenu() {
      isOpen = true;
      query = "";
      desk.querySelectorAll(".card, .toast").forEach((e) => e.remove());
      const sc = SCEN[scenario];
      Object.assign($("cmouse").style, { left: `${sc.x - 6}px`, top: `${sc.y + 2}px` });
      buildMain();
      setStatus("Menu reaberto com uma coluna só.");
    }

    function closeMenu(message) {
      isOpen = false;
      desk.querySelectorAll(".card").forEach((e) => e.remove());
      cols = [];
      updateWindow();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message ?? "Menu fechado sem colar. Pressione Alt+Q (ou o botão Reabrir) para abrir de novo.";
      desk.appendChild(toast);
    }

    // Teclado: ↑/↓ na coluna atual; → ou Enter numa pasta abre e entra; ← volta uma coluna; Esc fecha.
    document.addEventListener("keydown", (event) => {
      if (nav !== "cascata") return;
      if (event.altKey && event.key.toLowerCase() === "q") {
        event.preventDefault();
        isOpen ? closeMenu() : openMenu();
        return;
      }
      if (!isOpen) return;
      const col = cols[active];
      const row = col?.rows[col.sel];
      const key = event.key;
      const typed = active === 0 ? query : col?.query;
      const focusField = (c) => (c === cols[0] ? $("csearch") : c.input)?.focus();
      if (key === "Escape") closeMenu();
      else if (key === "ArrowDown" || key === "ArrowUp") {
        if (!col.rows.length) return;
        col.sel = Math.min(col.rows.length - 1, Math.max(0, col.sel + (key === "ArrowDown" ? 1 : -1)));
        closeFrom(active + 1);
        markRows();
      } else if (key === "Enter" || (key === "ArrowRight" && !typed)) {
        if (!row) return;
        if (row.entry.kind !== "folder") { if (key === "Enter") paste(row.entry); else return; }
        else {
          if (!(cols[active + 1] && cols[active + 1].key === row.entry.key)) openColumn(active, col.sel);
          active += 1;
          cols[active].sel = cols[active].rows.length ? 0 : -1;
          focusField(cols[active]);
          markRows();
        }
      } else if (key === "ArrowLeft" && !typed) {
        if (active === 0) return;
        closeFrom(active);
        focusField(cols[active]);
        markRows();
      } else if ((key === "c" || key === "C") && event.ctrlKey) {
        // Com um trecho da busca selecionado, Ctrl+C copia o trecho.
        const input = active === 0 ? $("csearch") : col.input;
        if (row?.entry.kind === "folder" || !row || input.selectionStart !== input.selectionEnd) return;
        copyEntry(row.entry);
      } else return;
      event.preventDefault();
    });

    // Clicar na área transparente (fora dos cartões) fecha o menu, como clicar fora.
    desk.addEventListener("mousedown", (event) => {
      if (isOpen && !event.target.closest(".card")) closeMenu();
    });

    function applyTheme() {
      const cls = theme === "escuro" ? "theme-dark" : "theme-light";
      document.body.className = cls;
      desk.className = `desk ${cls}`;
      $("desk").className = `desk ${cls}`;
    }

    function renderBars() {
      const navbar = $("navbar");
      navbar.innerHTML = `<span class="proto-label">Navegação nas pastas:</span>`;
      for (const [key, text] of [["cascata", "Abrir ao passar o mouse"], ["clique", "Clicar para abrir"]]) {
        const b = document.createElement("button");
        b.textContent = text;
        b.className = key === nav ? "on" : "";
        b.onclick = () => setNav(key);
        navbar.appendChild(b);
      }
      const bar = $("cstates");
      bar.innerHTML = "";
      for (const [key, sc] of Object.entries(SCEN)) {
        const b = document.createElement("button");
        b.textContent = sc.label;
        b.className = key === scenario ? "on" : "";
        b.onclick = () => { scenario = key; syncHash(); renderBars(); openMenu(); };
        bar.appendChild(b);
      }
      bar.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
      for (const name of ["claro", "escuro"]) {
        const b = document.createElement("button");
        b.textContent = name === "claro" ? "Tema claro" : "Tema escuro";
        b.className = name === theme ? "on" : "";
        b.onclick = () => { theme = name; syncHash(); applyTheme(); renderBars(); render(); $(nav === "cascata" ? "csearch" : "search")?.focus(); };
        bar.appendChild(b);
      }
      bar.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
      const reopen = document.createElement("button");
      reopen.textContent = "Reabrir (Alt+Q)";
      reopen.onclick = openMenu;
      bar.appendChild(reopen);
      const label = document.createElement("label");
      label.innerHTML = `<input type="checkbox" ${showWin ? "checked" : ""} /> Mostrar a janela transparente`;
      label.querySelector("input").onchange = (e) => { showWin = e.target.checked; updateWindow(); };
      bar.appendChild(label);
      $("cnote").textContent = `${SCEN[scenario].note} Teclado: ↑ ↓ → ← Enter Esc. Clique fora dos cartões fecha o menu.`;
    }

    function setNav(next) {
      nav = next;
      const cascade = nav === "cascata";
      for (const id of ["cstates", "cnote", "cdesk", "cstatus"]) $(id).style.display = cascade ? "" : "none";
      for (const id of ["states", "note", "desk"]) $(id).style.display = cascade ? "none" : "";
      syncHash();
      applyTheme();
      renderBars();
      if (cascade) openMenu(); else { render(); $("search").focus(); }
    }

    scenario = SCEN[params.get("cenario")] ? params.get("cenario") : "normal";
    setNav(params.get("nav") === "clique" ? "clique" : "cascata");
  })();
</script>
</body>
</html>
